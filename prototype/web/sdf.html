<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Mascot</title>
<style>
  :root {
    --bg-0: #121214;
    --bg-1: #060607;
    --ink: #e9e9ea;
    --muted: #6b6b70;
    --chip: #1a1a1d;
    --chip-on: #f2f2f2;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 45%, var(--bg-0) 0%, var(--bg-1) 70%);
    color: var(--ink);
    font: 12px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 12px 12px;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  #label { font: 11px/1 "SF Mono", ui-monospace, Menlo, monospace; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  #chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
  .chip { appearance: none; border: 0; border-radius: 999px; padding: 5px 10px; background: var(--chip); color: var(--ink); font: inherit; cursor: pointer; }
  .chip.on { background: var(--chip-on); color: #000; }
  .chip.auto { border: 1px solid #333; background: transparent; }
  .chip.auto.on { border-color: #777; }
  #sliders { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; }
  .slider { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 11px/1 "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
  .slider input { -webkit-appearance: none; appearance: none; width: 120px; height: 2px; background: #333; border-radius: 2px; outline: none; }
  .slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); cursor: pointer; }
  .slider output { width: 34px; text-align: right; }
  @media (max-width: 520px) { .chip { padding: 3px 8px; font-size: 11px; } .slider input { width: 80px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="label">idle</div>
  <div id="chips"></div>
  <div id="sliders">
    <label class="slider" data-k="dog">Dog <input type="range" min="0" max="1" step="0.01" value="0"><output></output></label>
    <label class="slider" data-k="soft">Blend <input type="range" min="0" max="0.4" step="0.01" value="0.16"><output></output></label>
    <label class="slider" data-k="round">Round <input type="range" min="0.06" max="0.46" step="0.01" value="0.2"><output></output></label>
    <label class="slider" data-k="flop">Ears <input type="range" min="0" max="1" step="0.01" value="0.9"><output></output></label>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------------
   One soft body, raymarched. Head, snout, ears, nose and tail are signed
   distance fields joined with a smooth union, so they melt into one skin
   instead of overlapping as separate solids. Only the outline is drawn, plus
   eyes/mouth painted onto the surface.
--------------------------------------------------------------------------- */
const FRAG = `#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 uRes;
uniform float uPxAngle, uLinePx, uStyle;
uniform vec3 uCam;
uniform mat3 uRot;          // world -> head-local rotation
uniform vec3 uPos;
uniform float uSq, uDog, uK, uRound, uTailX, uTailWag, uBlink, uSmile, uHappy;
uniform vec2 uGaze;
uniform vec4 uEar;          // left flop, left lift, right flop, right lift

float smin(float a, float b, float k) {
  if (k <= 0.0) return min(a, b);
  float h = max(k - abs(a - b), 0.0) / k;
  return min(a, b) - h * h * k * 0.25;
}
float sdRoundBox(vec3 p, vec3 b, float r) {
  vec3 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r;
}
float sdRoundCone(vec3 p, vec3 a, vec3 b, float r1, float r2) {
  vec3 ba = b - a; float l2 = dot(ba, ba); float rr = r1 - r2; float a2 = l2 - rr * rr; float il2 = 1.0 / l2;
  vec3 pa = p - a; float y = dot(pa, ba); float z = y - l2;
  vec3 xv = pa * l2 - ba * y; float x2 = dot(xv, xv); float y2 = y * y * l2; float z2 = z * z * l2;
  float k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;
  if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1;
  return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
}

// ear: two tapered segments; flop 0 = pointy and upright, 1 = floppy and hanging
float sdEar(vec3 p, float s, float flop, float lift) {
  float inset = max(0.0, uRound - 0.2) * 0.5;
  vec3 r0 = vec3(s * (0.38 - inset), 0.40 - inset, -0.02);
  float a = mix(3.14159 - 0.35, 1.0, flop) + lift;
  float bend = mix(0.12, 1.35, flop);
  vec3 p1 = r0 + vec3(s * sin(a), -cos(a), 0.0) * mix(0.24, 0.2, flop);
  float a2 = a - bend;
  vec3 p2 = p1 + vec3(s * sin(a2), -cos(a2), 0.0) * mix(0.22, 0.27, flop);
  vec3 q = p; q.z = (q.z - r0.z) * 2.6 + r0.z;   // flatten front-to-back
  float tip = mix(0.012, 0.065, flop);
  float d = smin(sdRoundCone(q, r0, p1, 0.115, 0.1), sdRoundCone(q, p1, p2, 0.1, tip), 0.06);
  return d * 0.38;
}

float snoutFront() { return 0.5 + 0.3 * uDog; }

// x: distance, y: material (0 body, 1 nose)
vec2 map(vec3 wp) {
  vec3 p = uRot * (wp - uPos);
  p.y = (p.y + 0.5) / uSq - 0.5;
  p.xz *= sqrt(uSq);
  float dScale = min(uSq, 1.0 / sqrt(uSq));

  float d = sdRoundBox(p, vec3(0.5), uRound);
  float front = snoutFront(), back = 0.3;
  float hz = (front - back) * 0.5;
  float snout = sdRoundBox(p - vec3(0.0, -0.17, back + hz), vec3(0.24, 0.15, hz), min(0.12, hz - 0.004));
  d = smin(d, snout, uK);
  d = smin(d, sdEar(p, -1.0, uEar.x, uEar.y), 0.07);
  d = smin(d, sdEar(p, 1.0, uEar.z, uEar.w), 0.07);

  vec3 tc = vec3(uTailX * 0.38 + uTailWag, -0.27, -0.5);
  float tail = length(p - tc) - 0.13;
  tail -= 0.022 * sin(p.x * 38.0) * sin(p.y * 38.0) * sin(p.z * 38.0);
  d = smin(d, tail, 0.05);

  vec3 nc = vec3(0.0, -0.06, front - 0.01);
  float nose = (length((p - nc) * vec3(1.0, 1.3, 1.5)) - 0.08) * 0.66;
  float mat = nose < d ? 1.0 : 0.0;
  d = smin(d, nose, 0.02);
  return vec2(d * dScale, mat);
}

vec3 normalAt(vec3 p) {
  const vec2 e = vec2(0.0015, -0.0015);
  return normalize(e.xyy * map(p + e.xyy).x + e.yyx * map(p + e.yyx).x + e.yxy * map(p + e.yxy).x + e.xxx * map(p + e.xxx).x);
}

// eyes and mouth, painted in head-local space; pw = pixel size there
float decals(vec3 p, vec3 n, float pw) {
  float ink = 0.0;
  if (n.z > 0.2 && p.z > 0.25) {
    for (int i = 0; i < 2; i++) {
      float s = i == 0 ? -1.0 : 1.0;
      vec2 c = vec2(s * 0.18, 0.1) + uGaze * vec2(0.035, 0.03);
      float rx = 0.062, ry = max(0.012, 0.088 * (1.0 - uBlink));
      vec2 q = (p.xy - c) / vec2(rx, ry);
      float e = (length(q) - 1.0) * min(rx, ry);
      // happy: carve the bottom away into a ^ crescent
      float carve = length((p.xy - c - vec2(0.0, -0.075 + 0.04 * (1.0 - uHappy))) / vec2(rx * 1.25, ry * 1.1)) - 1.0;
      if (uHappy > 0.01) e = max(e, -carve * min(rx, ry));
      ink = max(ink, 1.0 - smoothstep(-pw, pw, e));
    }
  }
  float front = snoutFront();
  if (n.z > 0.3 && p.z > front - 0.14) {
    float mw = 0.13, my = -0.205;
    float x = clamp(p.x, -mw, mw);
    float yc = my - uSmile * 0.05 * (1.0 - (x / mw) * (x / mw)) + 0.012 * uSmile * step(mw, abs(p.x));
    float dm = max(abs(p.y - yc) - 0.011, abs(p.x) - mw);
    float dp = max(abs(p.x) - 0.009, max(p.y - (-0.12), my - p.y));
    ink = max(ink, 1.0 - smoothstep(-pw, pw, min(dm, dp)));
  }
  return ink;
}

void main() {
  vec2 frag = gl_FragCoord.xy - 0.5 * uRes;
  vec3 rd = normalize(vec3(frag * uPxAngle, -1.0));
  vec3 ro = uCam;

  float t = 2.5, dPrev = 1e9, dPrev2 = 1e9, tPrev = t;
  float graze = 0.0, miss = 0.0;
  bool hit = false;
  vec2 m;
  for (int i = 0; i < 240; i++) {
    m = map(ro + rd * t);
    float d = m.x;
    float eps = uLinePx * uPxAngle * t;
    miss = max(miss, 1.0 - smoothstep(eps * 0.5, eps, d));
    if (d < 0.0004 * t) { hit = true; break; }
    // ray passed close to the surface and moved away: an inner contour
    if (dPrev < dPrev2 && d > dPrev) {
      float ep = uLinePx * uPxAngle * tPrev;
      graze = max(graze, 1.0 - smoothstep(ep * 0.5, ep, dPrev));
    }
    dPrev2 = dPrev; dPrev = d; tPrev = t;
    // small steps near the surface so the outline band is sampled cleanly
    t += d * (d < eps * 2.0 ? 0.35 : 0.8);
    if (t > 10.0) break;
  }

  vec3 fillCol = uStyle < 0.5 ? vec3(0.059, 0.059, 0.067) : vec3(0.945, 0.945, 0.933);
  vec3 inkCol  = uStyle < 0.5 ? vec3(0.95) : vec3(0.05);
  vec3 lineIn  = uStyle < 0.5 ? vec3(0.95) : vec3(0.1);
  vec3 silCol  = uStyle < 0.5 ? vec3(0.95) : vec3(0.945, 0.945, 0.933);

  if (!hit) {
    outColor = vec4(silCol * miss, miss);
    return;
  }
  vec3 wp = ro + rd * t;
  vec3 lp = uRot * (wp - uPos);
  vec3 ln = normalize(uRot * normalAt(wp));
  float pw = uPxAngle * t * 0.9;
  float ink = m.y > 0.5 ? 1.0 : decals(lp, ln, pw);
  vec3 col = mix(fillCol, inkCol, ink);
  col = mix(col, lineIn, graze);
  outColor = vec4(col, 1.0);
}`;
const VERT = `#version 300 es
void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

/* ---------------------------------------------------------------------------
   GL setup
--------------------------------------------------------------------------- */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { premultipliedAlpha: true, alpha: true, antialias: false });
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const loc = {};
for (const n of ['uRes', 'uPxAngle', 'uLinePx', 'uStyle', 'uCam', 'uRot', 'uPos', 'uSq', 'uDog', 'uK', 'uRound',
  'uTailX', 'uTailWag', 'uBlink', 'uSmile', 'uHappy', 'uGaze', 'uEar']) loc[n] = gl.getUniformLocation(prog, n);

/* ---------------------------------------------------------------------------
   Springs (same idea as the cube: poses set targets, springs do the motion)
--------------------------------------------------------------------------- */
const PRESET = { body: [120, 16], turn: [60, 12], jelly: [260, 13], face: [300, 30], ear: [70, 6], blink: [1600, 75], gaze: [650, 46], slow: [30, 11] };
const DEFAULTS = {
  yaw: [0, 'turn'], pitch: [0, 'body'], roll: [0, 'body'], y: [0, 'body'], sq: [1, 'jelly'],
  dog: [0, 'slow'], soft: [0.16, 'slow'], round: [0.2, 'slow'],
  flopL: [0.9, 'ear'], liftL: [0, 'ear'], flopR: [0.9, 'ear'], liftR: [0, 'ear'],
  blink: [0, 'blink'], gx: [0, 'gaze'], gy: [0, 'gaze'], smile: [0.3, 'face'], happy: [0, 'face'], wag: [0, 'ear'],
};
const P = {};
for (const [k, [v, pr]] of Object.entries(DEFAULTS)) P[k] = { v, vel: 0, base: v, off: 0, k: PRESET[pr][0], d: PRESET[pr][1] };
const V = (k) => P[k].v;
function step(dt) {
  for (const k in P) {
    const s = P[k];
    s.vel += (s.k * (s.base + s.off - s.v) - s.d * s.vel) * dt;
    s.v += s.vel * dt;
  }
}

/* ---------------------------------------------------------------------------
   Poses: chips to judge the shape from different angles and moods
--------------------------------------------------------------------------- */
const POSES = [
  { name: 'Cube', set: { dog: 0, yaw: 0, flopL: 0.9, flopR: 0.9, smile: 0.3 } },
  { name: 'Dog', set: { dog: 1, yaw: -0.35, flopL: 0.9, flopR: 0.9, smile: 0.3 } },
  { name: 'Profile', set: { dog: 1, yaw: -1.45, flopL: 0.9, flopR: 0.9 } },
  { name: 'Alert', set: { yaw: -0.3, flopL: 0, flopR: 0, liftL: 0, liftR: 0 } },
  { name: 'Happy', set: { yaw: 0.2, happy: 1, smile: 1, flopL: 1, flopR: 1 }, wag: true, bounce: true },
  { name: 'Look right', set: { yaw: 0.95, gx: 1 } },
  { name: 'Turn around', set: {}, spin: true },
];
let cur = null, curT = 0, auto = true, autoIdx = 0, autoNext = 1.5;
const label = document.getElementById('label');
function play(pose) {
  cur = pose; curT = 0;
  // leave shape sliders alone; reset the expressive bits
  for (const k of ['pitch', 'roll', 'gx', 'gy', 'happy', 'liftL', 'liftR', 'wag']) P[k].base = DEFAULTS[k][0];
  for (const [k, v] of Object.entries(pose.set)) {
    P[k].base = v;
    if (k in SLIDER_KEYS) syncSlider(k, v);
  }
  if (pose.spin) P.yaw.base = P.yaw.v + Math.PI * 2;
  label.textContent = pose.name;
  for (const b of document.querySelectorAll('.chip[data-i]')) b.classList.toggle('on', POSES[b.dataset.i] === pose);
}

/* ---------------------------------------------------------------------------
   UI
--------------------------------------------------------------------------- */
const chips = document.getElementById('chips');
POSES.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = p.name; b.dataset.i = i;
  b.onclick = () => { setAuto(false); play(p); };
  chips.appendChild(b);
});
const autoBtn = document.createElement('button');
autoBtn.className = 'chip auto on'; autoBtn.textContent = 'Auto';
autoBtn.onclick = () => setAuto(!auto);
chips.appendChild(autoBtn);
let style = 0;
const styleBtn = document.createElement('button');
styleBtn.className = 'chip auto'; styleBtn.textContent = 'Solid';
styleBtn.onclick = () => { style = 1 - style; styleBtn.textContent = style ? 'Line' : 'Solid'; };
chips.appendChild(styleBtn);
function setAuto(on) { auto = on; autoBtn.classList.toggle('on', on); autoNext = clock + 0.3; }

const SLIDER_KEYS = { dog: 'dog', soft: 'soft', round: 'round', flop: 'flop' };
function syncSlider(k, v) {
  const key = k === 'flopL' || k === 'flopR' ? 'flop' : k;
  const el = document.querySelector(`[data-k=${key}]`);
  if (!el) return;
  el.querySelector('input').value = v;
  el.querySelector('output').textContent = Math.round(v / parseFloat(el.querySelector('input').max) * 100) + '%';
}
for (const el of document.querySelectorAll('.slider')) {
  const k = el.dataset.k, input = el.querySelector('input');
  const apply = () => {
    const v = parseFloat(input.value);
    if (k === 'flop') { P.flopL.base = v; P.flopR.base = v; } else P[k].base = v;
    el.querySelector('output').textContent = Math.round(v / parseFloat(input.max) * 100) + '%';
  };
  input.addEventListener('input', () => { setAuto(false); apply(); });
  apply();
}
SLIDER_KEYS.flopL = SLIDER_KEYS.flopR = 'flop';

/* ---------------------------------------------------------------------------
   Loop
--------------------------------------------------------------------------- */
let clock = 0, last = performance.now(), nextBlink = 1.5, blinkEnd = -1, nextLook = 1, wagPhase = 0;
const FOV = 24 * Math.PI / 180;
let camZ = 5.6, camY = 0, pxAngle = 0.001, dpr = 1;

function resize() {
  dpr = Math.min(devicePixelRatio, 2);
  canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  const uiH = document.getElementById('ui').offsetHeight, h = innerHeight, aspect = innerWidth / h;
  const needH = Math.max(2.6 * h / Math.max(1, h - uiH), 2.6 / aspect);
  camZ = needH / 2 / Math.tan(FOV / 2);
  camY = -(uiH / h) * needH / 2;
  pxAngle = 2 * Math.tan(FOV / 2) / canvas.height;
}
addEventListener('resize', resize);
resize();

function rotT(yaw, pitch, roll) {
  // head rotation R = Ry * Rx * Rz; we upload R^T (world -> local), column-major
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cx = Math.cos(pitch), sx = Math.sin(pitch), cz = Math.cos(roll), sz = Math.sin(roll);
  const Ry = [[cy, 0, sy], [0, 1, 0], [-sy, 0, cy]];
  const Rx = [[1, 0, 0], [0, cx, -sx], [0, sx, cx]];
  const Rz = [[cz, -sz, 0], [sz, cz, 0], [0, 0, 1]];
  const mul = (A, B) => A.map((r, i) => [0, 1, 2].map((j) => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));
  const R = mul(mul(Ry, Rx), Rz);
  // column-major of R^T is row-major of R
  return new Float32Array([R[0][0], R[0][1], R[0][2], R[1][0], R[1][1], R[1][2], R[2][0], R[2][1], R[2][2]]);
}

function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now; clock += dt; curT += dt;

  if (auto && clock > autoNext) { play(POSES[autoIdx]); autoIdx = (autoIdx + 1) % POSES.length; autoNext = clock + 2.8; }
  // after a full turn, unwind the angle so the next pose doesn't spin back
  if (cur?.spin && Math.abs(P.yaw.v - P.yaw.base) < 0.02) { P.yaw.v -= Math.PI * 2; P.yaw.base -= Math.PI * 2; cur = { ...cur, spin: false }; }

  for (const k in P) P[k].off = 0;
  P.sq.off += Math.sin(clock * 2.2) * 0.012;
  P.y.off += Math.sin(clock * 1.5) * 0.012;
  if (cur?.bounce) { const b = Math.abs(Math.sin(curT * 7)); P.y.off += b * 0.1; P.sq.off += (b - 0.5) * 0.08; }
  // ears lag behind vertical motion
  P.liftL.off += Math.max(-0.5, Math.min(1, -P.y.vel * 1.4));
  P.liftR.off += Math.max(-0.5, Math.min(1, -P.y.vel * 1.4));
  if (clock > nextBlink) { P.blink.base = 1; blinkEnd = clock + 0.08; nextBlink = clock + 2 + Math.random() * 3.5; }
  if (blinkEnd > 0 && clock > blinkEnd) { P.blink.base = 0; blinkEnd = -1; }
  if (!cur?.set.gx && clock > nextLook) { P.gx.base = (Math.random() - 0.5) * 1.4; P.gy.base = (Math.random() - 0.5) * 0.8; nextLook = clock + 1 + Math.random() * 2; }
  wagPhase += dt * (cur?.wag ? 16 : 6);

  const n = Math.ceil(dt / (1 / 240));
  for (let i = 0; i < n; i++) step(dt / n);

  // tail shows on whichever side faces away
  const yaw = V('yaw');
  const yawWrapped = Math.atan2(Math.sin(yaw), Math.cos(yaw));
  const tailX = yawWrapped > 0.2 ? -1 : 1;

  gl.uniform2f(loc.uRes, canvas.width, canvas.height);
  gl.uniform1f(loc.uPxAngle, pxAngle);
  gl.uniform1f(loc.uLinePx, 5.0 * dpr);
  gl.uniform1f(loc.uStyle, style);
  gl.uniform3f(loc.uCam, 0, camY, camZ);
  gl.uniformMatrix3fv(loc.uRot, false, rotT(yaw + V('gx') * 0.05, V('pitch'), V('roll')));
  gl.uniform3f(loc.uPos, 0, -0.05 + V('y'), 0);
  gl.uniform1f(loc.uSq, Math.max(0.5, V('sq')));
  gl.uniform1f(loc.uDog, Math.max(0, Math.min(1, V('dog'))));
  gl.uniform1f(loc.uK, Math.max(0, V('soft')));
  gl.uniform1f(loc.uRound, V('round'));
  gl.uniform1f(loc.uTailX, tailX);
  gl.uniform1f(loc.uTailWag, Math.sin(wagPhase) * (cur?.wag ? 0.12 : 0.02));
  gl.uniform1f(loc.uBlink, Math.max(0, Math.min(1, V('blink'))));
  gl.uniform1f(loc.uSmile, V('smile'));
  gl.uniform1f(loc.uHappy, Math.max(0, Math.min(1, V('happy'))));
  gl.uniform2f(loc.uGaze, V('gx'), V('gy'));
  gl.uniform4f(loc.uEar, V('flopL'), V('liftL'), V('flopR'), V('liftR'));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__sdf = { P, play: (n) => play(POSES.find((p) => p.name === n)), setAuto };
</script>
</body>
</html>
