<!doctype html>
<html lang="en">
<head>

<title>Cube Mascot</title>
<style>
  :root {
    --bg-0: #121214;
    --bg-1: #060607;
    --ink: #e9e9ea;
    --muted: #6b6b70;
    --chip: #1a1a1d;
    --chip-on: #f2f2f2;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 45%, var(--bg-0) 0%, var(--bg-1) 70%);
    color: var(--ink);
    font: 12px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 12px 12px;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  #sliders { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; }
  .slider { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 11px/1 "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
  .slider input { -webkit-appearance: none; appearance: none; width: 140px; height: 2px; background: #333; border-radius: 2px; outline: none; }
  .slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); cursor: pointer; }
  .slider output { width: 34px; text-align: right; }
  @media (max-width: 520px) { .slider input { width: 90px; } }
  #label { font: 11px/1 "SF Mono", ui-monospace, Menlo, monospace; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  #chips {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 720px;
  }
  .chip {
    appearance: none; border: 0; border-radius: 999px; padding: 5px 10px;
    background: var(--chip); color: var(--ink); font: inherit; cursor: pointer;
  }
  .chip.on { background: var(--chip-on); color: #000; }
  .chip.auto { border: 1px solid #333; background: transparent; }
  .chip.auto.on { background: transparent; color: var(--ink); border-color: #777; }
  .chip.toggle:not(.on) { color: var(--muted); text-decoration: line-through; }
  @media (max-width: 520px) {
    #chips { max-width: 360px; gap: 4px; }
    .chip { padding: 3px 8px; font-size: 11px; }
  }

<script type="module">
import * as THREE from 'three';

/* ---------------------------------------------------------------------------
   Springs: every animatable value is a damped spring chasing a target.
   Expressions only set targets; the springs supply overshoot, follow-through
   and settle, which is where most of the "alive" feel comes from.
--------------------------------------------------------------------------- */
const PRESET = {
  body:   [120, 16],
  jelly:  [260, 13],
  face:   [300, 30],
  mouth:  [320, 28],
  arm:    [190, 15],
  pop:    [280, 15],
  snap:   [700, 48],
  fast:   [500, 30],
  slow:   [26, 10],
  drift:  [14, 7.2],
  blink:  [1600, 75],
  gaze:   [650, 46],
  ear:    [70, 6],
  wag:    [60, 11],
};

const DEFAULTS = {
  // body (cube-local units, radians)
  x: [0, 'body'], y: [0, 'body'], z: [0, 'body'],
  rx: [0, 'body'], ry: [0, 'body'], rz: [0, 'body'],
  sq: [1, 'jelly'], lean: [0, 'body'], leanZ: [0, 'body'],
  twist: [0, 'body'], taper: [0, 'body'], inflate: [0.17, 'pop'], scale: [1, 'body'],
  // face (px in a 512 face canvas, origin at centre)
  gx: [0, 'gaze'], gy: [0, 'gaze'],
  eyeSep: [96, 'face'], eyeY: [-34, 'face'], eyeW: [64, 'face'], eyeH: [112, 'face'], eyeR: [0.92, 'face'],
  eL: [1, 'face'], eR: [1, 'face'], close: [0, 'face'], blink: [0, 'blink'],
  lidT: [0, 'face'], lidA: [0, 'face'], happy: [0, 'face'], calm: [0, 'face'],
  mW: [0, 'mouth'], mC: [0, 'mouth'], mO: [0, 'mouth'], mRound: [0, 'mouth'], mReveal: [0, 'face'], mArch: [0, 'face'],
  book: [0, 'pop'],  // open book held in front (Reading)
  mY: [92, 'mouth'], mT: [15, 'mouth'], mTilt: [0, 'mouth'],
  // arms: out (0..1), hand target (cube-local), elbow bend
  aLo: [0, 'arm'], aLx: [-0.86, 'arm'], aLy: [-0.22, 'arm'], aLz: [0.05, 'arm'], aLbx: [0, 'arm'], aLby: [-0.12, 'arm'],
  aRo: [0, 'arm'], aRx: [0.86, 'arm'], aRy: [-0.22, 'arm'], aRz: [0.05, 'arm'], aRbx: [0, 'arm'], aRby: [-0.12, 'arm'],
  // ears: angle (0 = hanging, + = lifted outward/up), tip curl
  earLa: [0, 'ear'], earLb: [0.2, 'ear'], earRa: [0, 'ear'], earRb: [0.2, 'ear'],
  // tail: wag amount, height, puff
  tw: [0, 'wag'], ty: [0, 'body'], ts: [1, 'pop'],
};

const P = {};
for (const [k, [v, preset]] of Object.entries(DEFAULTS)) {
  const [stiff, damp] = PRESET[preset];
  P[k] = { v, vel: 0, base: v, off: 0, k: stiff, d: damp, preset };
}
function resetTargets() {
  for (const [k, [v, preset]] of Object.entries(DEFAULTS)) {
    const s = P[k];
    s.base = v;
    [s.k, s.d] = PRESET[preset];
  }
}
function stepSprings(dt) {
  for (const k in P) {
    const s = P[k];
    const a = s.k * (s.base + s.off - s.v) - s.d * s.vel;
    s.vel += a * dt;
    s.v += s.vel * dt;
  }
}
const V = (k) => P[k].v;

/* ---------------------------------------------------------------------------
   Deformation, shared by GPU (body + face) and CPU (arm anchors).
   inflate → cube-to-sphere, taper, twist, squash/stretch (bottom pivot), bend.
--------------------------------------------------------------------------- */
const U = {
  uInflate: { value: 0 }, uTaper: { value: 0 }, uTwist: { value: 0 },
  uSq: { value: 1 }, uLean: { value: 0 }, uLeanZ: { value: 0 },
  uW: { value: 1 }, uH: { value: 1 },  // body width / height from the shape sliders
};

const DEFORM_GLSL = /* glsl */`
uniform float uInflate, uTaper, uTwist, uSq, uLean, uLeanZ, uW, uH;
vec3 deformP(vec3 p) {
  p = mix(p, normalize(p) * 0.62, uInflate);
  p.x *= uW;
  p.y = (p.y + 0.5) * uH - 0.5;
  p.xz *= 1.0 + uTaper * p.y;
  float a = uTwist * p.y; float c = cos(a), s = sin(a);
  p.xz = vec2(c * p.x + s * p.z, -s * p.x + c * p.z);
  p.y = (p.y + 0.5) * uSq - 0.5;
  p.xz *= inversesqrt(uSq);
  float h = p.y + 0.5;
  p.x += uLean * h * h;
  p.z += uLeanZ * h * h;
  return p;
}
vec3 deformN(vec3 p, vec3 n) {
  n = normalize(n);
  vec3 r = abs(n.y) < 0.95 ? vec3(0., 1., 0.) : vec3(1., 0., 0.);
  vec3 t1 = normalize(cross(n, r));
  vec3 t2 = cross(n, t1);
  float e = 0.003;
  vec3 d0 = deformP(p);
  return normalize(cross(deformP(p + t1 * e) - d0, deformP(p + t2 * e) - d0));
}
`;

function deformJS(p) {
  let { x, y, z } = p;
  const inf = U.uInflate.value;
  if (inf) {
    const l = Math.hypot(x, y, z) || 1;
    x += (x / l * 0.62 - x) * inf; y += (y / l * 0.62 - y) * inf; z += (z / l * 0.62 - z) * inf;
  }
  x *= U.uW.value;
  y = (y + 0.5) * U.uH.value - 0.5;
  const t = 1 + U.uTaper.value * y; x *= t; z *= t;
  const a = U.uTwist.value * y, c = Math.cos(a), s = Math.sin(a);
  [x, z] = [c * x + s * z, -s * x + c * z];
  const sq = U.uSq.value;
  y = (y + 0.5) * sq - 0.5;
  const inv = 1 / Math.sqrt(sq); x *= inv; z *= inv;
  const h = y + 0.5;
  x += U.uLean.value * h * h; z += U.uLeanZ.value * h * h;
  return new THREE.Vector3(x, y, z);
}

function deformed(material, { offset = 0, key }) {
  material.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + DEFORM_GLSL)
      .replace('#include <begin_vertex>',
        offset
          ? `vec3 transformed = deformP(position) + deformN(position, normal) * ${offset.toFixed(4)};`
          : 'vec3 transformed = deformP(position);');
    if (!offset) {
      shader.vertexShader = shader.vertexShader.replace('#include <beginnormal_vertex>',
        'vec3 objectNormal = deformN(position, normal);\n#ifdef USE_TANGENT\nvec3 objectTangent = vec3(tangent.xyz);\n#endif');
    }
  };
  material.customProgramCacheKey = () => key;
  return material;
}

/* ---------------------------------------------------------------------------
   Scene
--------------------------------------------------------------------------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, premultipliedAlpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);

const fxCanvas = document.createElement('canvas');
stage.appendChild(fxCanvas);
const fx = fxCanvas.getContext('2d');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 50);

/* The cube is still 3D underneath, but it's drawn in two passes and then
   inked in screen space:
   - id pass: object id per pixel (body, left arm, right arm)
   - fill pass: body/arm coverage in R, face ink coverage in G
   The composite draws wobbly pencil lines only where the object id changes,
   so turning reads as a changing silhouette, never as edges or shaded sides.
   The wobble re-randomises ~8x a second. */
const ID_VERT = /* glsl */`
${DEFORM_GLSL}
uniform float uDeform;
void main() {
  vec3 p = uDeform > 0.5 ? deformP(position) : position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`;
const ID_FRAG = /* glsl */`
uniform float uObj;
void main() { gl_FragColor = vec4(0., 0., 0., uObj / 255.); }`;
const idMat = (obj, deform) => new THREE.ShaderMaterial({
  uniforms: { ...U, uObj: { value: obj }, uDeform: { value: deform ? 1 : 0 } },
  vertexShader: ID_VERT, fragmentShader: ID_FRAG,
});
const fillMat = (deform) => {
  const m = new THREE.MeshBasicMaterial({ color: 0xff0000, toneMapped: false });
  return deform ? deformed(m, { key: 'fill' }) : m;
};

const COMPOSITE_FRAG = /* glsl */`
precision highp float;
uniform sampler2D tFill, tId;
uniform vec2 uRes; uniform float uSeed, uPx, uLineScale;
uniform float uPencil;   // 1 = wobbly grainy pencil, 0 = clean crisp line
uniform vec3 uCircle;    // backdrop circle: centre x, y and radius in framebuffer px
uniform float uCircleOn;
uniform vec3 uCircleCol;
uniform vec3 uFillCol, uInkCol, uLineCol, uSilCol;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
vec2 boil(vec2 px, float s, float amp) {
  vec2 q = px / (70.0 * uPx) + s * 17.31;
  return (vec2(noise(q), noise(q + 31.7)) - 0.5) * amp * uPx;
}
float idAt(vec2 px) { return floor(texture2D(tId, px / uRes).a * 255.0 + 0.5); }
// x: line where an arm overlaps the body, y: outer silhouette
vec2 edges(vec2 px, float r) {
  float c = idAt(px);
  vec2 e = vec2(0.);
  for (int i = 0; i < 8; i++) {
    float a = float(i) * 0.785398;
    float n = idAt(px + vec2(cos(a), sin(a)) * r);
    if (abs(n - c) < 0.5) continue;
    if (c < 0.5 || n < 0.5) e.y += 1.; else e.x += 1.;
  }
  return clamp(e / 3.0, 0., 1.);
}

// clean overlap line: share of nearby samples that belong to a different part
float cleanOverlap(vec2 px, float r) {
  float c = idAt(px);
  if (c < 0.5) return 0.;
  float n = 0.;
  for (int i = 0; i < 12; i++) {
    float t = float(i) * 0.5236;
    vec2 d = vec2(cos(t), sin(t));
    float a = idAt(px + d * r), b = idAt(px + d * r * 0.5);
    n += (a > 0.5 && abs(a - c) > 0.5 ? 1. : 0.) + (b > 0.5 && abs(b - c) > 0.5 ? 1. : 0.);
  }
  return smoothstep(0.06, 0.28, n / 24.);
}
float fillAt(vec2 px) { vec4 f = texture2D(tFill, px / uRes); return clamp(f.r + f.g + f.b, 0., 1.); }
// how much book is around a pixel, so no outline is drawn along its edges
float bookNear(vec2 px, float r) {
  float b = texture2D(tFill, px / uRes).b;
  for (int i = 0; i < 16; i++) {
    float t = float(i) * 0.392699;
    vec2 d = vec2(cos(t), sin(t));
    b = max(b, max(texture2D(tFill, (px + d * r) / uRes).b, texture2D(tFill, (px + d * r * 0.5) / uRes).b));
  }
  return b;
}
// clean silhouette: a smooth band where the blurred coverage crosses 0.5
float cleanSil(vec2 px, float r) {
  float a = fillAt(px);
  for (int i = 0; i < 12; i++) {
    float t = float(i) * 0.5236;
    vec2 d = vec2(cos(t), sin(t));
    a += fillAt(px + d * r) + fillAt(px + d * r * 0.5);
  }
  a /= 25.0;
  return 1.0 - smoothstep(0.32, 0.48, abs(a - 0.5));
}

void main() {
  vec2 px0 = gl_FragCoord.xy;
  vec2 px = px0 + boil(px0, uSeed, 1.0) * uPencil;
  float grain = mix(1.0, 0.55 + 0.45 * hash(floor(px0 / (1.0 * uPx)) + uSeed), uPencil);

  vec4 f = texture2D(tFill, px / uRes);
  float fill = clamp(f.r + f.g + f.b, 0., 1.);
  float ink = f.g, bookInk = f.b;

  float r = uPx * uLineScale * mix(3.0, 2.7 + 0.7 * noise(px0 / (38.0 * uPx) + uSeed), uPencil);
  vec2 e1 = edges(px, r);
  vec2 e2 = edges(px0 + boil(px0, uSeed + 3.7, 1.6) + vec2(0.6) * uPx, uPx * 1.6) * 0.35 * uPencil;
  vec2 e = max(e1, e2) * grain;
  if (uPencil < 0.5) { e.y = cleanSil(px, r * 1.25); e.x = cleanOverlap(px, r * 1.1); }
  e *= 1.0 - smoothstep(0.0, 0.3, bookNear(px, r * 2.6));  // the book is a plain dark shape, never outlined

  vec3 col = uFillCol;
  col = mix(col, uInkCol, ink * (0.88 + 0.12 * grain));
  col = mix(col, uInkCol, clamp(bookInk / max(fill, 1e-3), 0., 1.));
  // parts drawn with lower alpha in the fill pass (the grey paw) get a light shade
  float shade = clamp(1.0 - f.a / max(fill, 1e-3), 0., 1.);
  col = mix(col, uInkCol, shade * 0.3);
  col = mix(col, uLineCol, e.x);
  col = mix(col, uSilCol, e.y);
  // premultiplied: the shape keeps its own colour right to its anti-aliased
  // edge, and only the uncovered part of a pixel shows the outline stroke
  float alpha = fill + e.y * (1.0 - fill);
  vec3 premul = col * fill + uSilCol * e.y * (1.0 - fill);

  // static grey circle behind the mascot. Anything above its middle or out to
  // the sides may peek past the edge; anything dropping below it is clipped,
  // as if the mascot sits in a round window.
  if (uCircleOn > 0.5) {
    float d = length(px0 - uCircle.xy);
    float inC = 1.0 - smoothstep(uCircle.z - uPx, uCircle.z + uPx, d);
    float below = smoothstep(uCircle.y + uPx, uCircle.y - uPx, px0.y);
    float clip = mix(1.0, inC, below);
    premul *= clip; alpha *= clip;
    gl_FragColor = vec4(premul + uCircleCol * inC * (1.0 - alpha), alpha + inC * (1.0 - alpha));
    return;
  }
  gl_FragColor = vec4(premul, alpha);
}`;

const rtOpts = { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true };
const idRT = new THREE.WebGLRenderTarget(1, 1, rtOpts);
const fillRT = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: true, samples: 4 });

const STYLES = {
  line:  { fill: 0x0f0f11, ink: 0xf2f2f0, line: 0xf2f2f0, sil: 0xf2f2f0 },
  solid: { fill: 0xf1f1ee, ink: 0x0d0d0e, line: 0x1a1a1c, sil: 0xf1f1ee },
};
const compositeMat = new THREE.ShaderMaterial({
  uniforms: {
    tFill: { value: fillRT.texture }, tId: { value: idRT.texture },
    uRes: { value: new THREE.Vector2(1, 1) }, uSeed: { value: 0 }, uPx: { value: 1 }, uLineScale: { value: 1 }, uPencil: { value: 0 },
    uCircle: { value: new THREE.Vector3() }, uCircleOn: { value: 1 }, uCircleCol: { value: new THREE.Color().setHex(0x4a4a4f, THREE.LinearSRGBColorSpace) },
    uFillCol: { value: new THREE.Color() }, uInkCol: { value: new THREE.Color() },
    uLineCol: { value: new THREE.Color() }, uSilCol: { value: new THREE.Color() },
  },
  vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: COMPOSITE_FRAG,
  depthTest: false, depthWrite: false,
});
let style = 'solid';
function setStyle(name) {
  style = name;
  const s = STYLES[name], u = compositeMat.uniforms;
  // colours go straight to the framebuffer, so keep them in sRGB
  u.uFillCol.value.setHex(s.fill, THREE.LinearSRGBColorSpace);
  u.uInkCol.value.setHex(s.ink, THREE.LinearSRGBColorSpace);
  u.uLineCol.value.setHex(s.line, THREE.LinearSRGBColorSpace);
  u.uSilCol.value.setHex(s.sil, THREE.LinearSRGBColorSpace);
}
setStyle('solid');
const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compositeMat));

// Rounded cube with an even grid on every face, so twist/bend actually curve the faces.
function roundedCube(size = 1, radius = 0.13, seg = 40) {
  const g = new THREE.BoxGeometry(size, size, size, seg, seg, seg);
  const pos = g.attributes.position, nor = g.attributes.normal;
  const h = size / 2 - radius, p = new THREE.Vector3(), q = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i);
    q.set(THREE.MathUtils.clamp(p.x, -h, h), THREE.MathUtils.clamp(p.y, -h, h), THREE.MathUtils.clamp(p.z, -h, h));
    n.subVectors(p, q).normalize();
    p.copy(q).addScaledVector(n, radius);
    pos.setXYZ(i, p.x, p.y, p.z);
    nor.setXYZ(i, n.x, n.y, n.z);
  }
  return g;
}

const BASE_Y = -0.12;
// world units. The body sits low: the circle's bottom edge cuts off its base,
// so the circle reads as a frame it rises out of, not a disc behind it.
const CIRCLE = { x: 0, y: 0.12, r: 0.7 };
const rig = new THREE.Group(); scene.add(rig);
let bodyRadius = 0.15, taperBase = 0;
const body = new THREE.Mesh(roundedCube(1, bodyRadius), fillMat(true));
body.userData = { fill: body.material, id: idMat(1, true) };
rig.add(body);

// Face: a 2D canvas redrawn every frame, laid on the front face and deformed with it.
const FACE_PX = 1024, FACE_UNITS = 0.8;
const faceCanvas = document.createElement('canvas');
faceCanvas.width = faceCanvas.height = FACE_PX;
const fc = faceCanvas.getContext('2d');
const faceTex = new THREE.CanvasTexture(faceCanvas);
faceTex.colorSpace = THREE.SRGBColorSpace;
faceTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const faceGeo = new THREE.PlaneGeometry(FACE_UNITS, FACE_UNITS, 24, 24).translate(0, 0, 0.5);
const faceMat = deformed(new THREE.MeshBasicMaterial({
  map: faceTex, transparent: true, depthWrite: false,
  polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, toneMapped: false,
}), { offset: 0.004, key: 'face' });
const face = new THREE.Mesh(faceGeo, faceMat);
face.renderOrder = 2;
rig.add(face);

// Paws: short, thick limbs that taper a little, ending in a soft pad with three
// toe beans (same scalloped language as the tail). Rebuilt per frame.
const armFill = fillMat(false);
const LIMB_RINGS = 24, LIMB_SIDES = 12;
const limbIndex = [];
for (let i = 0; i < LIMB_RINGS - 1; i++) for (let k = 0; k < LIMB_SIDES; k++) {
  const a = i * LIMB_SIDES + k, b = i * LIMB_SIDES + (k + 1) % LIMB_SIDES;

const beanGeo = new THREE.SphereGeometry(1, 20, 14);
function makeArm(obj) {
  const id = idMat(obj, false);

  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(LIMB_RINGS * LIMB_SIDES * 3), 3));
  g.setIndex(limbIndex);

const arms = { L: makeArm(2), R: makeArm(3) };

// Ears: a flat, leaf-shaped flap per side, rebuilt along a curling spine each frame.
const EAR_RINGS = 14, EAR_LEN = 0.46;
const earFill = new THREE.MeshBasicMaterial({ color: 0xff0000, toneMapped: false, side: THREE.DoubleSide });
function makeEar(obj) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(EAR_RINGS * 4 * 3), 3));
  const idx = [];
  for (let i = 0; i < EAR_RINGS - 1; i++) for (let k = 0; k < 4; k++) {
    const a = i * 4 + k, b = i * 4 + (k + 1) % 4, c = b + 4, d = a + 4;
    idx.push(a, b, c, a, c, d);

  idx.push(0, 1, 2, 0, 2, 3, e, e + 1, e + 2, e, e + 2, e + 3);
  g.setIndex(idx);

  mesh.frustumCulled = false;

  return mesh;
}
const ears = { L: makeEar(4), R: makeEar(5) };

// Tail: a woolly pom-pom on the back, built from a core and a ring of small
// puffs so its outline scallops like yarn. It sits off to one side so a bit
// peeks out past the body even at rest.
const TAIL_R = 0.17;
const tail = new THREE.Group();
rig.add(tail);
const tailFill = fillMat(false), tailId = idMat(6, false);
const puffGeo = new THREE.SphereGeometry(1, 20, 14);
const tailPuffs = [];
const PUFFS = 18;
for (let i = 0; i < PUFFS + 1; i++) {
  const m = new THREE.Mesh(puffGeo, tailFill);
  m.userData = { fill: tailFill, id: tailId };
  if (i === PUFFS) { m.scale.setScalar(0.74); tail.add(m); break; }
  // even spread on a sphere (fibonacci), each puff slightly different in size
  const y = 1 - (i + 0.5) / PUFFS * 2, r = Math.sqrt(1 - y * y), a = i * 2.39996;
  m.userData.dir = new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r);
  m.userData.size = 0.34 + 0.08 * ((i * 7) % 5) / 4;
  tailPuffs.push(m);
  tail.add(m);
}

// Book: one dark slab with a thin light border, held up in front of the face so
// the eyes peek over it. A grey paw peeks out from behind the left edge and an
// oval paw sits over the right edge. Covers render into the B channel (filled
// dark, never outlined); the grey paw writes a lower alpha, which the
// composite turns into a light grey shade.
const book = new THREE.Group();
rig.add(book);
const bookFill = fillMat(false);
const coverFill = new THREE.MeshBasicMaterial({ color: 0x0000ff, toneMapped: false });
const greyFill = new THREE.MeshBasicMaterial({ color: 0xff0000, opacity: 0.5, toneMapped: false });
const bookPart = (geo, fill = bookFill) => {
  const m = new THREE.Mesh(geo, fill);
  m.userData = { fill, id: idMat(1, false) };
  return m;
};
const BOOK_W = 0.64, BOOK_H = 0.46, BORDER = 0.022;
book.add(bookPart(new THREE.BoxGeometry(BOOK_W, BOOK_H, 0.004), coverFill));
book.add(bookPart(new THREE.BoxGeometry(BOOK_W + BORDER * 2, BOOK_H + BORDER * 2, 0.004).translate(0, 0, -0.005)));
const leftPaw = bookPart(new THREE.SphereGeometry(1, 24, 16), greyFill);
leftPaw.scale.set(0.085, 0.1, 0.03);
leftPaw.position.set(-BOOK_W / 2 - 0.02, -0.02, -0.05);
const rightPaw = bookPart(new THREE.SphereGeometry(1, 24, 16));
rightPaw.scale.set(0.1, 0.055, 0.03);
rightPaw.position.set(BOOK_W / 2 + 0.01, -0.03, 0.03);
book.add(leftPaw, rightPaw);
const bookMeshes = [];
book.traverse((o) => { if (o.isMesh) bookMeshes.push(o); });
function updateBook() {
  const k = V('book');
  book.visible = k > 0.01;
  if (!book.visible) return;
  book.position.set(-0.06, -0.36 - (1 - Math.min(1, k)) * 0.75, 0.74);
  book.rotation.z = 0;  // parallel to the face, so it follows the head's turn and tilt
  book.scale.setScalar(Math.max(0.01, Math.min(1.1, k)));
}

let tailPhase = 0;
const show = { ears: false, limbs: false, tail: false, nose: false, mouth: false, circle: true };  // part toggles in the chip bar
function updateTail(time) {
  tail.visible = show.tail;
  compositeMat.uniforms.uCircleOn.value = show.circle ? 1 : 0;
  tailPuffs.forEach((m, k) => {
    const breathe = 1 + 0.06 * Math.sin(time * 2.3 + k * 1.7);
    m.position.copy(m.userData.dir).multiplyScalar(0.62 * breathe);
    m.scale.setScalar(m.userData.size * breathe);
  });
  const wag = V('tw'), swing = Math.sin(tailPhase);
  // the tail peeks out on whichever side faces away: right at rest, left once
  // the cube turns to its right
  const side = 1 - 2 * THREE.MathUtils.smoothstep(V('ry'), 0.05, 0.3);
  const root = deformJS({ x: 0.42 * side, y: -0.28 + V('ty'), z: -0.46 });
  tail.position.set(root.x + swing * wag * 0.5, root.y + Math.abs(swing) * wag * 0.05, root.z - 0.08 + Math.abs(swing) * wag * 0.12);
  tail.rotation.set(0, time * 0.3, swing * wag * 0.6);
  tail.scale.setScalar(TAIL_R * V('ts'));
}
function updateEar(side) {
  const s = side === 'L' ? -1 : 1, mesh = ears[side];
  mesh.visible = show.ears;
  const inset = Math.max(0, bodyRadius - 0.19) * 0.6;
  const root = deformJS({ x: s * (0.4 - inset), y: 0.4 - inset, z: 0.06 });
  const a = 0.65 + V('ear' + side + 'a'), bend = V('ear' + side + 'b');
  const pos = mesh.geometry.attributes.position;
  let cx = root.x, cy = root.y;
  const ds = EAR_LEN / (EAR_RINGS - 1);
  for (let i = 0; i < EAR_RINGS; i++) {
    const t = i / (EAR_RINGS - 1);
    const h = a - bend * 1.6 * t;
    const dx = s * Math.sin(h), dy = -Math.cos(h);
    if (i > 0) { cx += dx * ds; cy += dy * ds; }
    const w = 0.2 * Math.sqrt(Math.max(0, Math.sin(Math.PI * (0.12 + 0.88 * Math.pow(t, 1.25))))) / 2;
    const th = 0.024 * (1 - 0.5 * t);
    const px = -dy * w, py = dx * w;
    pos.setXYZ(i * 4 + 0, cx + px, cy + py, root.z + th);
    pos.setXYZ(i * 4 + 1, cx - px, cy - py, root.z + th);
    pos.setXYZ(i * 4 + 2, cx - px, cy - py, root.z - th);
    pos.setXYZ(i * 4 + 3, cx + px, cy + py, root.z - th);
  }
  pos.needsUpdate = true;
}

// Keep arm points outside the (deformed) body so hands never sink into it.
function pushOut(p, margin) {
  const sq = U.uSq.value;
  const hx = 0.5 * U.uW.value / Math.sqrt(sq) + 0.03 + margin;
  const top = -0.5 + U.uH.value * sq + 0.03 + margin;
  const h = p.y + 0.5, cx = U.uLean.value * h * h, cz = U.uLeanZ.value * h * h;
  const dx = hx - Math.abs(p.x - cx), dz = hx - Math.abs(p.z - cz), dy = top - p.y;
  if (dx <= 0 || dz <= 0 || dy <= 0 || p.y < -0.5 - margin) return p;
  if (dz <= dx && dz <= dy) p.z = cz + Math.sign(p.z - cz || 1) * hx;
  else if (dx <= dy) p.x = cx + Math.sign(p.x - cx || 1) * hx;
  else p.y = top;
  return p;
}

function updateArm(side) {
  const s = side === 'L' ? -1 : 1, pre = 'a' + side;
  const out = V(pre + 'o'), { tube, hand, pad, toes } = arms[side];
  const visible = out > 0.015;
  tube.visible = hand.visible = visible && show.limbs;
  if (!visible) return;
  const inner = deformJS({ x: s * 0.3, y: -0.06, z: 0 });
  const surf = deformJS({ x: s * 0.5, y: -0.06, z: 0 });
  const target = new THREE.Vector3(V(pre + 'x'), V(pre + 'y'), V(pre + 'z'));
  target.lerp(surf, 0.15);  // stubby: paws reach a little less than the old arms
  const handPos = pushOut(surf.clone().lerp(target, out), 0.1 * Math.min(1, out * 2.5));
  const c1 = surf.clone().add(new THREE.Vector3(s * 0.26 * out, 0, 0));
  const c2 = handPos.clone().add(new THREE.Vector3(V(pre + 'bx') * out, V(pre + 'by') * out, 0));
  const bez = new THREE.CubicBezierCurve3(inner, c1, c2, handPos);
  const pts = bez.getPoints(16).map((p, i) => (i < 4 ? p : pushOut(p, 0.04)));
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  const frames = curve.computeFrenetFrames(LIMB_RINGS - 1, false);
  const pos = tube.geometry.attributes.position, c = new THREE.Vector3();
  const grow = Math.min(1, out * 2.5);
  for (let i = 0; i < LIMB_RINGS; i++) {
    const t = i / (LIMB_RINGS - 1);
    curve.getPointAt(t, c);
    const r = (0.078 - 0.016 * t) * grow;
    const N = frames.normals[i], B = frames.binormals[i];
    for (let k = 0; k < LIMB_SIDES; k++) {
      const a = k / LIMB_SIDES * Math.PI * 2, ca = Math.cos(a) * r, sa = Math.sin(a) * r;
      pos.setXYZ(i * LIMB_SIDES + k, c.x + N.x * ca + B.x * sa, c.y + N.y * ca + B.y * sa, c.z + N.z * ca + B.z * sa);
    }
  }
  pos.needsUpdate = true;

  // pad sits across the end of the limb; toes line its far edge
  const T = frames.tangents[LIMB_RINGS - 1];
  const spread = new THREE.Vector3().crossVectors(T, new THREE.Vector3(0, 0, 1));
  if (spread.lengthSq() < 1e-4) spread.set(1, 0, 0);
  spread.normalize();
  hand.position.copy(handPos);
  hand.scale.setScalar(grow);
  pad.position.copy(T).multiplyScalar(0.02);
  pad.scale.set(0.1, 0.1, 0.1);
  toes.forEach((m, k) => {
    const off = (k - 1) * 0.062;
    m.position.copy(T).multiplyScalar(0.085 - Math.abs(k - 1) * 0.022).addScaledVector(spread, off);
    m.scale.setScalar(0.043);
  });
}

/* ---------------------------------------------------------------------------
   Face drawing (black ink on transparent, 512-unit space centred at 0,0)
--------------------------------------------------------------------------- */
const INK = '#00ff00';     // face ink lands in the G channel of the fill pass
const eyeBuf = document.createElement('canvas'); eyeBuf.width = eyeBuf.height = 512;
const eb = eyeBuf.getContext('2d');

function pill(ctx, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, r); ctx.fill();
}

function drawEye(side, time) {
  const g = eb; // eye buffer, scale 2 → 256-unit space centred
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, 512, 512);
  g.setTransform(2, 0, 0, 2, 256, 256);
  g.fillStyle = INK; g.strokeStyle = INK;

  const per = side < 0 ? V('eL') : V('eR');
  const H0 = Math.max(V('eyeH'), 1);
  const hBase = H0 * per;
  const calm = THREE.MathUtils.clamp(V('calm'), 0, 1);
  const shut = Math.min(1, Math.max(V('close'), V('blink'), calm));
  const h = Math.max(hBase * (1 - shut), 11);
  const squashed = THREE.MathUtils.clamp(1 - h / H0, 0, 1);
  const w = V('eyeW') * (1 + 0.32 * squashed);

  g.globalAlpha = 1 - THREE.MathUtils.clamp((calm - 0.3) / 0.5, 0, 1);
  pill(g, w, h, Math.min(w, h) / 2 * V('eyeR'));
  // lids: erase above a sloped line (angry/sad/sleepy)
  const lidT = V('lidT'), lidA = V('lidA');
  if (lidT > 0.005 || Math.abs(lidA) > 0.01) {
    g.globalCompositeOperation = 'destination-out';
    const y0 = -h / 2 + lidT * h;
    g.save(); g.translate(0, y0); g.rotate(-side * lidA);
    g.fillRect(-200, -400, 400, 400);
    g.restore();
    g.globalCompositeOperation = 'source-over';
  }
  // happy: erase a disc from below, leaving a ^ crescent
  const hp = V('happy');
  if (hp > 0.01) {
    g.globalCompositeOperation = 'destination-out';
    const rr = w * 0.78;
    g.beginPath(); g.arc(0, h / 2 + rr - hp * h * 0.78, rr, 0, Math.PI * 2); g.fill();
    g.globalCompositeOperation = 'source-over';
  }
  // catchlight: a small reflection dot in the upper corner of an open eye
  const shine = THREE.MathUtils.clamp((h - 30) / 40, 0, 1) * (1 - THREE.MathUtils.clamp(V('happy'), 0, 1)) * (1 - calm);
  if (shine > 0.02) {
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'destination-out';
    g.beginPath(); g.arc(w * 0.16, -h * 0.2, Math.min(w, h) * 0.2 * shine, 0, Math.PI * 2); g.fill();
  }

  // calm: eyes closed into a soft ‿, like a content or unwilling dog
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = THREE.MathUtils.clamp((calm - 0.2) / 0.5, 0, 1);
  if (g.globalAlpha > 0) {
    const d = 26 * calm;
    g.lineWidth = 11; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-w * 0.55, -d * 0.3); g.quadraticCurveTo(0, d, w * 0.55, -d * 0.3); g.stroke();
  }
  g.globalAlpha = 1;
}

// Open jaw under a mouth line, with a tongue when it's a happy open mouth.
function drawJaw(ctx, cx, jw, top, jd, lw, c, o, solid) {
  ctx.save(); ctx.translate(cx, 0);
  ctx.beginPath();
  ctx.moveTo(-jw, top);
  ctx.bezierCurveTo(-jw, top + jd * 1.3, jw, top + jd * 1.3, jw, top);
  ctx.closePath();
  if (solid) ctx.fill();
  ctx.stroke();
  if (c > 0.3 && o > 0.3) {
    ctx.lineWidth = lw * 0.6;
    ctx.beginPath();
    ctx.moveTo(-jw * 0.4, top + jd * 0.7);
    ctx.quadraticCurveTo(0, top + jd * 1.2, jw * 0.4, top + jd * 0.7);
    if (!solid) ctx.stroke();
  }
  ctx.restore();
}

// Separate mouth: a single curve below the nose with a gap, sitting a little
// to one side like a dog's smirk. Smiles deepen it and raise the right end
// (with a small cheek tick); frowns flip it; mTilt pushes it further aside.
function drawSeparateMouth(ctx, ny, mW, c, o, round, lw, solid) {
  const tilt = V('mTilt');
  const my = ny + 44 + (V('mY') - 92) * 0.5;
  const off = 10 + tilt * 0.8, mw = 30 + mW * 0.25;
  ctx.lineWidth = lw * 0.85;
  if (round > 0.5 && o > 0.05) {
    const r = 6 + mW * 0.26 * o;
    ctx.beginPath(); ctx.ellipse(off * 0.4, my + r - 6, r * 0.85, r, 0, 0, Math.PI * 2);
    if (solid) ctx.fill();
    ctx.stroke();
    return;
  }
  const depth = 4 + c * 16;
  const lL = c * 4 - tilt * 0.4, lR = c * 12 + tilt * 0.6;
  const x0 = off - mw, x1 = off + mw;
  ctx.beginPath();
  ctx.moveTo(x0, my - lL);
  ctx.quadraticCurveTo(off - mw * 0.1, my + depth, x1, my - lR);
  if (c > 0.15) {
    // cheek tick at the raised end
    ctx.moveTo(x1 - 3, my - lR + 6 * c);
    ctx.lineTo(x1 + 5, my - lR - 10 * c);
  }
  ctx.stroke();
  if (o > 0.03) drawJaw(ctx, off, mw * 0.55, my + Math.max(depth, 0) * 0.45, o * (24 + mW * 0.35), lw, c, o, solid);
}

// Dog face: a prominent rounded-triangle nose. In 'joined' mode one wide mouth
// line hangs from its tip; its ends curl up (happy), droop (sad) or lift on one
// side (smirk/unsure), and an open jaw drops underneath it.
let mouthStyle = 'separate';
function drawMouth(ctx) {
  const mW = Math.max(0, V('mW')), c = V('mC'), o = Math.max(0, V('mO'));
  const round = THREE.MathUtils.clamp(V('mRound'), 0, 1), lw = V('mT');
  const solid = style === 'solid';
  ctx.save();
  ctx.translate(V('gx') * 0.35, V('gy') * 0.35);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const ny = 40;
  if (show.nose) {
    ctx.beginPath();
    ctx.moveTo(-25, ny - 15);
    ctx.quadraticCurveTo(0, ny - 21, 25, ny - 15);
    ctx.quadraticCurveTo(25, ny + 5, 0, ny + 17);
    ctx.quadraticCurveTo(-25, ny + 5, -25, ny - 15);
    ctx.closePath();
    ctx.lineWidth = 6;
    ctx.fill(); ctx.stroke();
  }
  if (!show.mouth) { ctx.restore(); return; }

  // confused: a short line down from the nose into a lopsided upside-down
  // curve (left side droops, right side runs flat)
  if (V('mArch') > 0.5) {
    const y0 = ny + 44;
    ctx.lineWidth = lw * 0.9;
    ctx.beginPath();
    ctx.moveTo(0, ny + 15); ctx.lineTo(0, y0);
    ctx.moveTo(-38, y0 + 26);
    ctx.quadraticCurveTo(-30, y0, 0, y0);
    ctx.lineTo(34, y0 + 2);
    ctx.stroke();
    ctx.restore();
    return;
  }

  // grin: a big U smile across the lower face that appears at once and widens
  // from the centre outward, hung from the nose by a line
  const reveal = THREE.MathUtils.clamp(V('mReveal'), 0, 1);
  if (reveal > 0.02) {
    const gw = 150, gy = ny + 5, gd = 70;
    const q = (t) => [(2 * t - 1) * gw, gy + 4 * t * (1 - t) * gd];  // the U as a quadratic
    ctx.lineWidth = lw * 0.9;
    ctx.beginPath();
    for (let k = 0; k <= 40; k++) {
      const [x, y] = q(0.5 + (k / 40 - 0.5) * reveal);
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.moveTo(0, ny + 15);
    ctx.lineTo(0, gy + gd - lw * 0.2);
    ctx.stroke();
    ctx.restore();
    return;
  }
  if (mouthStyle === 'separate') {
    drawSeparateMouth(ctx, ny, mW, c, o, round, lw, solid);
    ctx.restore();
    return;
  }

  const yc = ny + 19 + (V('mY') - 92) * 0.5;
  ctx.translate(0, yc);
  ctx.lineWidth = lw * 0.85;
  if (yc > ny + 22) { ctx.beginPath(); ctx.moveTo(0, ny + 17 - yc); ctx.lineTo(0, 0); ctx.stroke(); }

  if (round > 0.5 && o > 0.05) {
    const r = 6 + mW * 0.26 * o;
    ctx.beginPath(); ctx.ellipse(0, r + 3, r * 0.85, r, 0, 0, Math.PI * 2);
    if (solid) ctx.fill();
    ctx.stroke();
  } else {
    const ww = 36 + mW * 0.22, tilt = V('mTilt');
    const dep = 5 + Math.max(c, 0) * 5 - Math.max(-c, 0) * 2;
    ctx.beginPath();
    for (const side of [-1, 1]) {
      // each half: from the nose tip, a shallow dip, ending raised or lowered
      const lift = 4 + c * 16 - side * tilt * 0.9;
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(side * ww * 0.5, dep, side * ww, -lift);
    }
    ctx.stroke();
    if (o > 0.03) drawJaw(ctx, 0, ww * 0.6, Math.max(dep, 0) * 0.6, o * (24 + mW * 0.35), lw, c, o, solid);
  }
  ctx.restore();
}

function drawFace(time) {
  fc.setTransform(1, 0, 0, 1, 0, 0);
  fc.clearRect(0, 0, FACE_PX, FACE_PX);
  const s = FACE_PX / 512 * 1.28;
  fc.setTransform(s, 0, 0, s, FACE_PX / 2, FACE_PX / 2 + 10);
  fc.scale(1 / U.uW.value, 1 / U.uH.value);
  fc.fillStyle = INK; fc.strokeStyle = INK;
  for (const side of [-1, 1]) {
    drawEye(side, time);
    const cx = side * V('eyeSep') + V('gx'), cy = V('eyeY') + V('gy');
    fc.drawImage(eyeBuf, cx - 128, cy - 128, 256, 256);
  }
  drawMouth(fc);
  faceTex.needsUpdate = true;
}

/* ---------------------------------------------------------------------------
   FX overlay (screen space, anchored to points on the cube)
--------------------------------------------------------------------------- */
const particles = [];
const tmpV = new THREE.Vector3();
function spawn(type, opts = {}) {

  particles.push(base);
}
const FX = {
  z: () => spawn('z', { life: 2.2, anchor: new THREE.Vector3(0.42, 0.55, 0.3) }),
  q: () => spawn('q', { life: 2.4 }),

// world-space path of the fly in Distracted; after 3s it leaves up and away
function flyAt(t) {
  const v = new THREE.Vector3(0.95 * Math.sin(t * 1.7 + 0.6), 0.3 + 0.32 * Math.sin(t * 3.1), 0.7);
  if (t > 3) { const k = t - 3; v.x += k * k * 3; v.y += k * 1.5; }
  return v;
}
FX.fly = () => spawn('fly', { life: 3.6, path: flyAt });
const easeOutBack = (t) => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);

function drawFX(unitPx) {
  const dpr = renderer.getPixelRatio();
  fx.setTransform(1, 0, 0, 1, 0, 0);
  fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = fxCanvas.width / dpr, Hh = fxCanvas.height / dpr;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const age = clock - p.t0 - (p.delay || 0);
    if (age > p.life) { particles.splice(i, 1); continue; }
    if (age < 0) continue;
    const t = age / p.life;
    if (p.path) tmpV.copy(p.path(age)); else { tmpV.copy(p.anchor); rig.localToWorld(tmpV); }
    tmpV.project(camera);
    let x = (tmpV.x * 0.5 + 0.5) * W, y = (-tmpV.y * 0.5 + 0.5) * Hh;
    const u = unitPx;
    const fade = Math.min(1, age * 6) * (1 - Math.max(0, (t - 0.75) / 0.25));
    fx.save(); fx.globalAlpha = fade; fx.fillStyle = '#f4f4f4'; fx.strokeStyle = '#f4f4f4';
    fx.lineCap = 'round'; fx.lineJoin = 'round';
    switch (p.type) {
      case 'z': {
        x += u * (0.25 * t + 0.05 * Math.sin(age * 4)); y -= u * 0.45 * t;
        fx.font = `600 ${u * (0.12 + 0.12 * t)}px -apple-system, system-ui`;
        fx.fillText('z', x, y); break;
      }
      case 'q': case 'bang': {
        const s = easeOutBack(Math.min(1, age * 3.2));
        fx.translate(x, y); fx.rotate(Math.sin(age * 5) * 0.12 * (1 - t)); fx.scale(s, s);
        fx.font = `700 ${u * 0.3}px -apple-system, system-ui`; fx.textAlign = 'center';
        fx.fillText(p.type === 'q' ? '?' : '!', 0, 0); break;
      }
      case 'fly': {
        const flap = Math.sin(age * 60) > 0 ? 1 : 0.55;
        fx.beginPath(); fx.arc(x, y, u * 0.022, 0, Math.PI * 2); fx.fill();
        fx.globalAlpha = fade * 0.6;
        fx.beginPath(); fx.ellipse(x - u * 0.022, y - u * 0.03 * flap, u * 0.018, u * 0.028 * flap, -0.5, 0, Math.PI * 2); fx.fill();
        fx.beginPath(); fx.ellipse(x + u * 0.022, y - u * 0.03 * flap, u * 0.018, u * 0.028 * flap, 0.5, 0, Math.PI * 2); fx.fill();
        break;
      }
      case 'huff': {
        fx.lineWidth = u * 0.018;
        for (const k of [0, 1]) {
          const px = x - u * (0.06 + 0.14 * t + k * 0.05), py = y + (k ? 1 : -1) * u * 0.035;
          fx.beginPath(); fx.arc(px, py, u * (0.025 + 0.02 * t), Math.PI * 0.6, Math.PI * 1.4); fx.stroke();
        }
        break;
      }
      case 'spark': {
        const s = u * 0.07 * Math.sin(Math.PI * t);
        fx.translate(x, y); fx.rotate(age * 2); fx.beginPath();
        for (let k = 0; k < 4; k++) {
          const a = k * Math.PI / 2;
          fx.lineTo(Math.cos(a) * s, Math.sin(a) * s);
          fx.lineTo(Math.cos(a + Math.PI / 4) * s * 0.28, Math.sin(a + Math.PI / 4) * s * 0.28);
        }
        fx.closePath(); fx.fill(); break;
      }
      case 'anger': {
        const s = u * 0.075 * easeOutBack(Math.min(1, age * 4)) * (1 + 0.15 * Math.max(0, Math.sin(age * 14)));
        fx.translate(x, y); fx.lineWidth = u * 0.022;
        for (let k = 0; k < 4; k++) {
          fx.save(); fx.rotate(k * Math.PI / 2); fx.beginPath();
          fx.moveTo(s * 0.25, -s); fx.quadraticCurveTo(s * 0.25, -s * 0.25, s, -s * 0.25); fx.stroke(); fx.restore();
        }
        break;
      }
      case 'dots': {
        for (let k = 0; k < 3; k++) {
          const b = Math.max(0, Math.sin(age * 7 - k * 0.9));
          fx.beginPath(); fx.arc(x + (k - 1) * u * 0.1, y - b * u * 0.05, u * 0.026, 0, Math.PI * 2); fx.fill();
        }
        break;
      }
      case 'sweat': {
        y += u * 0.12 * t * t;
        const s = u * 0.06;
        fx.translate(x, y); fx.beginPath();
        fx.moveTo(0, -s * 1.4); fx.quadraticCurveTo(s, 0, 0, s * 0.8); fx.quadraticCurveTo(-s, 0, 0, -s * 1.4);
        fx.fill(); break;
      }
    }
    fx.restore();
  }
}

  Yawn:      [[0.4, { earLa: 1.3, earRa: 1.3, earLb: 0.6, earRb: 0.6 }], [1.6, { earLa: -0.2, earRa: -0.2, earLb: 0.2, earRb: 0.2 }, 'slow'], [2.8, { earLa: 0, earRa: 0 }]],
  Tired:     [[0, { earLa: -0.35, earRa: -0.35, earLb: 0.05, earRb: 0.05 }, 'slow'], [3.4, { earLa: 0, earRa: 0, earLb: 0.2, earRb: 0.2 }]],
  Distracted:[[0.3, { earLa: 1.4, earRa: 1.4, earLb: 0.5, earRb: 0.5 }], [3.1, { earLa: 0, earRa: 0, earLb: 0.2, earRb: 0.2 }]],
  Sleepy:    [[0, { earLa: -0.3, earRa: -0.3 }, 'slow'], [4.3, { earLa: 2.6, earRa: 2.6, earLb: 0.3, earRb: 0.3 }, 'snap'], [4.6, { earLa: 0, earRa: 0, earLb: 0.2, earRb: 0.2 }, 'ear']],
};
const TAIL_KEYS = {
  Hello:     [[0.14, { tw: 0.9 }], [2.6, { tw: 0 }]],
  Listening: [[0, { tw: 0.25 }], [2.9, { tw: 0 }]],
  Working:   [[0.28, { tw: 0.3 }], [2.4, { tw: 0 }]],
  Wink:      [[0.15, { tw: 0.5 }], [1.5, { tw: 0 }]],
  Laugh:     [[0, { tw: 0.7 }], [2.3, { tw: 0 }]],
  Surprised: [[0.13, { ts: 1.35, ty: 0.08 }], [2.0, { ts: 1, ty: 0 }]],
  Sad:       [[0, { ty: -0.15, ts: 0.85 }, 'slow'], [3.2, { ty: 0, ts: 1 }]],
  Angry:     [[0.22, { ts: 1.25, ty: 0.1 }], [2.5, { ts: 1, ty: 0 }]],
  Grin:      [[0.15, { tw: 0.5 }], [2.3, { tw: 0 }]],
  Unwilling: [[0.3, { ty: -0.05 }], [3.1, { ty: 0 }]],
  Yawn:      [[0.4, { ts: 1.15 }], [1.6, { ts: 1 }]],
  Tired:     [[0, { ty: -0.14, ts: 0.88 }, 'slow'], [3.4, { ty: 0, ts: 1 }]],
  Distracted:[[0.3, { tw: 0.35 }], [3.0, { tw: 0 }]],
  Sleepy:    [[1.0, { ty: -0.1 }, 'slow'], [4.3, { ts: 1.3 }, 'snap'], [4.6, { ts: 1, ty: 0 }, 'pop']],
};
for (const e of EXPRESSIONS) {
  e.keys = [...e.keys, ...(EAR_KEYS[e.name] || []), ...(TAIL_KEYS[e.name] || [])].sort((a, b) => a[0] - b[0]);
}

/* ---------------------------------------------------------------------------
   Runner
--------------------------------------------------------------------------- */
let clock = 0, cur = IDLE, curT = 0, auto = true, idleUntil = 1.2, nextIdx = 0;
let nextBlink = 1.5, blinkEnd = -1, nextSaccade = 0.5, nextTwitch = 4, nextWag = 6, wagEnd = -1;
const pointer = { x: 0, y: 0, active: false };

function applyKey(k) {
  const [, vals, preset] = k;
  for (const [name, val] of Object.entries(vals)) {
    if (name === 'fx') { FX[val]?.(); continue; }
    const s = P[name]; if (!s) continue;
    s.base = val;
    if (preset) [s.k, s.d] = PRESET[preset];
  }
}
function play(expr) {
  cur.end?.();
  resetTargets();
  cur = expr; curT = 0;
  if (expr !== IDLE) particles.length = 0;
  for (const k of expr.keys) if (k[0] <= 0) applyKey(k);
  label.textContent = expr.name;
  for (const b of chips.querySelectorAll('.chip[data-i]')) b.classList.toggle('on', EXPRESSIONS[b.dataset.i] === expr);
}
function goIdle(hold) { play(IDLE); idleUntil = clock + hold; }

function update(dt) {
  const prev = curT;
  curT += dt;
  for (const k of cur.keys) if (k[0] > prev && k[0] <= curT) applyKey(k);

  if (cur === IDLE) {
    if (auto && clock > idleUntil) { play(EXPRESSIONS[nextIdx]); nextIdx = (nextIdx + 1) % EXPRESSIONS.length; }
  } else if (curT > cur.dur) {
    goIdle(auto ? 1.1 : Infinity);
  }

  for (const k in P) P[k].off = 0;
  const add = (k, v) => { P[k].off += v; };
  cur.proc?.(curT, add);

  // idle life: breathing + bob always on
  add('sq', Math.sin(clock * 2.2) * 0.012);
  add('y', Math.sin(clock * 1.5) * 0.014);
  add('lean', Math.sin(clock * 1.1) * 0.03 - THREE.MathUtils.clamp(P.x.vel * 0.5, -0.25, 0.25));
  add('leanZ', -THREE.MathUtils.clamp(P.rx.vel * 0.12, -0.2, 0.2));
  add('sq', THREE.MathUtils.clamp(P.y.vel * 0.1, -0.12, 0.14));
  if (cur.name !== 'Working') add('twist', Math.sin(clock * 0.9) * 0.05 - THREE.MathUtils.clamp(P.ry.vel * 0.1, -0.3, 0.3));
  add('taper', Math.sin(clock * 2.2 + 1) * 0.015);

  // ears: lag behind body motion and hang toward gravity when the body tilts
  const clampE = (v) => THREE.MathUtils.clamp(v, -0.6, 1.6);
  const spin = Math.abs(P.ry.vel) * 0.15;
  add('earLa', clampE(-P.y.vel * 1.4 + P.x.vel * 1.2 + P.rz.vel * 0.5 + V('rz') * 0.8 + spin));
  add('earRa', clampE(-P.y.vel * 1.4 - P.x.vel * 1.2 - P.rz.vel * 0.5 - V('rz') * 0.8 + spin));
  // tail: wag speed rises with excitement; idle gets an occasional happy wag
  tailPhase += dt * (9 + 7 * Math.max(0, V('tw')));
  if (cur === IDLE && clock > nextWag && wagEnd < 0) { P.tw.base = 0.45; wagEnd = clock + 1.2; }
  if (wagEnd > 0 && clock > wagEnd) { if (cur === IDLE) P.tw.base = 0; wagEnd = -1; nextWag = clock + 6 + Math.random() * 8; }
  if (cur === IDLE && clock > nextTwitch) {
    const side = Math.random() < 0.5 ? 'L' : 'R';
    P['ear' + side + 'a'].vel += 6;
    nextTwitch = clock + 3 + Math.random() * 5;
  }

  if (cur.follow) {
    if (pointer.active) {
      add('gx', pointer.x * 34); add('gy', -pointer.y * 22);
      add('ry', pointer.x * 0.28); add('rx', -pointer.y * 0.16);
    } else if (clock > nextSaccade) {
      P.gx.base = (Math.random() - 0.5) * 50; P.gy.base = (Math.random() - 0.5) * 22;
      P.ry.base = P.gx.base * 0.004;
      nextSaccade = clock + 0.8 + Math.random() * 2.2;
    }
  }

  if (!cur.noBlink && clock > nextBlink) { P.blink.base = 1; blinkEnd = clock + 0.075; nextBlink = clock + 2.2 + Math.random() * 3.5; if (Math.random() < 0.2) nextBlink = clock + 0.3; }
  if (blinkEnd > 0 && clock > blinkEnd) { P.blink.base = 0; blinkEnd = -1; }

  // integrate at 240 Hz for stable stiff springs
  const n = Math.ceil(dt / (1 / 240));
  for (let i = 0; i < n; i++) stepSprings(dt / n);
}

function applyToScene() {
  U.uInflate.value = V('inflate'); U.uTaper.value = V('taper') + taperBase; U.uTwist.value = V('twist');
  U.uSq.value = Math.max(0.3, V('sq')); U.uLean.value = V('lean'); U.uLeanZ.value = V('leanZ');
  rig.position.set(V('x'), BASE_Y + V('y'), V('z'));
  rig.rotation.set(V('rx'), V('ry') + V('gx') * 0.0018, V('rz'), 'YXZ');
  rig.scale.setScalar(V('scale'));
  updateArm('L'); updateArm('R');
  updateEar('L'); updateEar('R');
  updateTail(clock);
  updateBook();
}

/* ---------------------------------------------------------------------------
   UI + loop
--------------------------------------------------------------------------- */
const label = document.getElementById('label');
const chips = document.getElementById('chips');
EXPRESSIONS.forEach((e, i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = e.name; b.dataset.i = i;
  b.onclick = () => { setAuto(false); play(e); };
  chips.appendChild(b);
});
const autoBtn = document.createElement('button');
autoBtn.className = 'chip auto on'; autoBtn.textContent = 'Auto';
autoBtn.onclick = () => setAuto(!auto);
chips.appendChild(autoBtn);
const styleBtn = document.createElement('button');
styleBtn.className = 'chip auto'; styleBtn.textContent = 'Line';
styleBtn.onclick = () => { setStyle(style === 'line' ? 'solid' : 'line'); styleBtn.textContent = style === 'line' ? 'Solid' : 'Line'; };
chips.appendChild(styleBtn);
const mouthBtn = document.createElement('button');
mouthBtn.className = 'chip auto'; mouthBtn.textContent = 'Joined mouth';
mouthBtn.onclick = () => {
  mouthStyle = mouthStyle === 'separate' ? 'joined' : 'separate';
  mouthBtn.textContent = mouthStyle === 'separate' ? 'Joined mouth' : 'Separate mouth';
};
chips.appendChild(mouthBtn);
const pencilBtn = document.createElement('button');
pencilBtn.className = 'chip auto'; pencilBtn.textContent = 'Pencil';
pencilBtn.onclick = () => {
  const on = compositeMat.uniforms.uPencil.value < 0.5;
  compositeMat.uniforms.uPencil.value = on ? 1 : 0;
  pencilBtn.classList.toggle('on', on);
};
chips.appendChild(pencilBtn);
for (const [key, name] of [['ears', 'Ears'], ['limbs', 'Limbs'], ['tail', 'Tail'], ['nose', 'Nose'], ['mouth', 'Mouth'], ['circle', 'Circle']]) {
  try { const saved = localStorage.getItem('cube.show.' + key); if (saved !== null) show[key] = saved === '1'; } catch {}
  const b = document.createElement('button');
  b.className = 'chip auto toggle' + (show[key] ? ' on' : ''); b.textContent = name;
  b.onclick = () => {
    show[key] = !show[key];
    b.classList.toggle('on', show[key]);
    try { localStorage.setItem('cube.show.' + key, show[key] ? '1' : '0'); } catch {}
  };
  chips.appendChild(b);
}
function setAuto(on) { auto = on; autoBtn.classList.toggle('on', on); if (on && cur === IDLE) idleUntil = clock + 0.4; }

addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'ArrowRight') { setAuto(false); play(EXPRESSIONS[nextIdx]); nextIdx = (nextIdx + 1) % EXPRESSIONS.length; }
  if (e.key === 'a') setAuto(!auto);
});
addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1; pointer.y = -((e.clientY / innerHeight) * 2 - 1);
  pointer.active = true;
});
document.addEventListener('pointerleave', () => { pointer.active = false; });

// Size: shrinks the mascot inside the view; lines thin out a little with it.
let size = 0.37;
const sizeInput = document.querySelector('[data-k=size] input'), sizeOut = document.querySelector('[data-k=size] output');
try { size = Math.min(1, Math.max(0.25, parseFloat(localStorage.getItem('cube.size')) || 0.37)); } catch {}
sizeInput.value = size;
function setSize(v) {
  size = v;
  sizeOut.textContent = Math.round(v * 100) + '%';
  compositeMat.uniforms.uLineScale.value = 0.5 + 0.5 * v;
  try { localStorage.setItem('cube.size', v); } catch {}
  resize();
}
sizeInput.addEventListener('input', () => setSize(parseFloat(sizeInput.value)));

// Shape: corner roundness rebuilds the body; width/height/taper feed the deform
// (taper > 0 makes the bottom narrower than the top).
// circle position/size in framebuffer px (origin bottom-left), from world units
function updateCircle() {
  const w = innerWidth, h = innerHeight, dprR = renderer.getPixelRatio();
  camera.updateMatrixWorld();
  const c = new THREE.Vector3(CIRCLE.x, CIRCLE.y, 0).project(camera), e = new THREE.Vector3(CIRCLE.x + CIRCLE.r, CIRCLE.y, 0).project(camera);
  compositeMat.uniforms.uCircle.value.set((c.x * 0.5 + 0.5) * w * dprR, (c.y * 0.5 + 0.5) * h * dprR, (e.x - c.x) * 0.5 * w * dprR);
}

const SHAPE = {
  circleR: (v) => { CIRCLE.r = v; updateCircle(); },
  circleX: (v) => { CIRCLE.x = v; updateCircle(); },
  circleY: (v) => { CIRCLE.y = v; updateCircle(); },
  circleTone: (v) => { compositeMat.uniforms.uCircleCol.value.setRGB(v, v, v * 1.02, THREE.LinearSRGBColorSpace); },
  taper: (v) => { taperBase = v; },
  round: (v) => { bodyRadius = v; body.geometry.dispose(); body.geometry = roundedCube(1, v); },
  width: (v) => { U.uW.value = v; },
  height: (v) => { U.uH.value = v; },
};
// Reset puts every slider back to the value written in the markup.
document.getElementById('reset').onclick = () => {
  for (const input of document.querySelectorAll('.slider input')) {
    input.value = input.defaultValue;
    input.dispatchEvent(new Event('input'));
  }
};
for (const [k, apply] of Object.entries(SHAPE)) {
  const input = document.querySelector(`[data-k=${k}] input`), out = document.querySelector(`[data-k=${k}] output`);
  const set = (v) => {
    apply(v);
    out.textContent = k === 'round' ? Math.round((v - 0.04) / 0.42 * 100) + '%'
      : k === 'taper' || k === 'circleTone' ? Math.round(v * 100) + '%'
      : k === 'circleX' || k === 'circleY' ? (v >= 0 ? '+' : '') + v.toFixed(2) : v.toFixed(2) + '×';
    try { localStorage.setItem('cube.' + k, v); } catch {}
  };
  let saved = NaN;
  try { saved = parseFloat(localStorage.getItem('cube.' + k)); } catch {}
  if (!Number.isNaN(saved)) input.value = saved;
  input.addEventListener('input', () => set(parseFloat(input.value)));
  set(parseFloat(input.value));
}

const params = new URLSearchParams(location.search);
if (params.has('nochips')) document.getElementById('ui').style.display = 'none';

let unitPx = 100;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  const bw = Math.round(w * renderer.getPixelRatio()), bh = Math.round(h * renderer.getPixelRatio());
  idRT.setSize(bw, bh); fillRT.setSize(bw, bh);
  compositeMat.uniforms.uRes.value.set(bw, bh);
  compositeMat.uniforms.uPx.value = renderer.getPixelRatio();
  const dpr = renderer.getPixelRatio();
  fxCanvas.width = w * dpr; fxCanvas.height = h * dpr;
  camera.aspect = w / h;
  // fit a 2.8 x 2.9 unit box regardless of aspect; leave room for the chip bar
  const uiH = document.getElementById('ui').offsetHeight;
  const fitH = 2.6 * h / Math.max(1, h - uiH);
  const needH = Math.max(fitH, 2.6 / camera.aspect) / size;
  const dist = needH / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const shift = (uiH / h) * needH / 2;
  camera.position.set(0, -shift, dist);
  camera.lookAt(0, -shift, 0);
  camera.updateProjectionMatrix();
  unitPx = h / needH;
  updateCircle();
}
addEventListener('resize', resize);
setSize(size);

let last = performance.now();
function renderPencil() {
  compositeMat.uniforms.uSeed.value = Math.floor(clock * 8) % 97;

  const meshes = [body, ...arms.L.meshes, ...arms.R.meshes, ears.L, ears.R, ...tail.children, ...bookMeshes];
  meshes.forEach((m) => { m.material = m.userData.id; });
  face.visible = false;
  renderer.setRenderTarget(idRT); renderer.clear(); renderer.render(scene, camera);
  meshes.forEach((m) => { m.material = m.userData.fill; });
  face.visible = true;
  renderer.setRenderTarget(fillRT); renderer.clear(); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.clear(); renderer.render(quadScene, quadCam);
}

function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  clock += dt;
  update(dt);
  applyToScene();
  drawFace(clock);
  renderPencil();
  drawFX(unitPx);
  requestAnimationFrame(frame);
}
goIdle(1.2);
requestAnimationFrame(frame);

// debug hooks for screenshots
window.__cube = { play: (n) => play(EXPRESSIONS.find((e) => e.name === n)), setAuto, P, EXPRESSIONS };
</script>
</body>
</html>
