# The Rust core: the daemon obid and its crates (docs/ARCHITECTURE.md, section 3).
# Every folder under crates/ is a member, so a new crate joins without editing this file. Crates
# take the shared dependencies below with `workspace = true`; a crate that needs another one asks
# the Rust core to add it here (docs/ARCHITECTURE.md, section 6).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/obi-ai-bot/obi"
publish = false

[workspace.dependencies]
# Async runtime and traits (the plug-in traits in docs/ARCHITECTURE.md 5.5 are async-trait).
tokio = { version = "1.53", features = ["full"] }
async-trait = "0.1.92"
# JSON everywhere: the runner API, the plug-in wire protocol, the Obi-to-Obi protocol.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Errors and logs.
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The runner API's HTTP server.
axum = "0.8.9"
# The API token obid makes on first start, and the host name `GET /v1/status` reports.
getrandom = "0.4.3"
hex = "0.4.3"
gethostname = "1.1.0"
# The Obi-to-Obi protocol (crates/obi-protocol): Ed25519, SHA-256, base64url, its JSON Schemas,
# and ECMAScript number formatting for canonical JSON (RFC 8785).
ed25519-dalek = "3.0.0"
sha2 = "0.11.1"
base64 = "0.23.1"
jsonschema = { version = "0.58.6", default-features = false }
ryu-js = "1.0.3"
# Ids for jobs and messages.
uuid = { version = "1.28.0", features = ["v4"] }
# Process groups for agents and checks: SIGTERM, then SIGKILL, to everything one started.
nix = { version = "0.31", features = ["signal", "process", "user"] }
# Streamed answers: the event stream and `GET /v1/jobs/{id}/wait`.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
