[package]
name = "obi-plugin-host"
description = "Finds, starts, sandboxes and talks to Obi's plug-ins: all obid calls (docs/ARCHITECTURE.md, section 5.5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
obi-plugin-api = { path = "../obi-plugin-api" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# `PluginHost::start_with` and `Options`: other times and another sandbox tool, for the host's
# own tests only. Not part of docs/ARCHITECTURE.md 5.5; `obid` doesn't turn it on.
test-support = []

[dev-dependencies]
# The host's tests turn `test-support` on for themselves.
obi-plugin-host = { path = ".", features = ["test-support"] }

# The plug-in the host's tests run, one of each kind (tests/plugins/): it speaks obi-plugin/0.1
# and does what its settings say. Only the tests use it.
[[bin]]
name = "obi-plugin-test"
path = "src/bin/obi-plugin-test.rs"
test = false
doc = false

# Not the workspace lints: `sandbox_check` needs unsafe, which the workspace forbids (#461).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
