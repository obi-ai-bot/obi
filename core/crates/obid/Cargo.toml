[package]
name = "obid"
description = "Obi's engine as a daemon: the runner API (docs/runner-api.md) and everything behind it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
obi-protocol = { path = "../obi-protocol" }
obi-plugin-api.workspace = true
obi-plugin-host.workspace = true
axum.workspace = true
# The FCM service account's RS256 JWT (crate::push): the RSA that rustls already builds.
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"] }
base64.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
libc.workspace = true
nix.workspace = true
p256.workspace = true
reqwest.workspace = true
tokio-stream.workspace = true
getrandom.workspace = true
gethostname.workspace = true
hex.workspace = true
jiff.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# NFKD and general categories for memory's rules (src/memory.rs, `widens`): already in the
# tree, through `url`, their compiled data only.
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
# The gateway calls obid's own router in process (src/gateway.rs).
tower = { version = "0.5.3", default-features = false, features = ["util"] }
uuid.workspace = true
# Slack's Socket Mode (src/listen.rs): one WebSocket, over the rustls that reqwest already builds,
# with the platform's own roots as reqwest has them.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"

[target.'cfg(target_os = "macos")'.dependencies]
# The vault's Keychain store (src/vault.rs), as the Swift runner's KeychainVault.
core-foundation = "0.10.1"
security-framework = "3.7.0"

[lints]
workspace = true
