<!doctype html>
<html lang="en">

<title>Oby</title>
<!-- dev:start -->

     controls never flash on screen while the main script loads -->
<script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');</script>

<style>
  /* Oby draws on a transparent background: the host decides what's behind it */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* dev:start  the playground (controls); package/build.sh strips every dev block */
  :root {
    --bg: #0a0a0b;
    --ink: #e9e9ea;
    --muted: #6b6b70;
    --chip: #1a1a1d;
    --chip-on: #f2f2f2;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 12px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  #ui {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 12px 12px;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  #sliders { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; }
  .slider { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 11px/1 "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
  .slider input { -webkit-appearance: none; appearance: none; width: 140px; height: 2px; background: #333; border-radius: 2px; outline: none; }
  .slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); cursor: pointer; }
  .slider output { width: 34px; text-align: right; }
  @media (max-width: 520px) { .slider input { width: 90px; } }
  #label { font: 11px/1 "SF Mono", ui-monospace, Menlo, monospace; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  #states { display: flex; gap: 6px; }
  #chips {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 720px;
  }
  .chip {
    appearance: none; border: 0; border-radius: 999px; padding: 5px 10px;
    background: var(--chip); color: var(--ink); font: inherit; cursor: pointer;
  }
  .chip.on { background: var(--chip-on); color: #000; }
  .chip.auto { border: 1px solid #333; background: transparent; }
  .chip.auto.on { background: transparent; color: var(--ink); border-color: #777; }
  body.collapsed #ui { display: none; }
  #uiToggle {
    position: fixed; right: 10px; top: 10px; z-index: 2;
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid #333;
    background: transparent; color: var(--muted); cursor: pointer;
    display: grid; place-items: center; padding: 0;
  }
  #uiToggle:hover { color: var(--ink); border-color: #777; }
  body:not(.collapsed) #uiToggle { color: var(--ink); border-color: #777; }
  @media (max-width: 520px) {
    #chips { max-width: 360px; gap: 4px; }
    .chip { padding: 3px 8px; font-size: 11px; }
  }
  html.embed #ui, html.embed #uiToggle { display: none; }
  html.embed body { background: transparent; }
  /* dev:end */
</style>

{ "imports": { "three": "./vendor/three.module.js" } }

<body>
<div id="stage"></div>
<!-- dev:start -->
<button id="uiToggle" title="Controls" aria-label="Show or hide controls">

    <button class="chip auto" id="reset">Reset</button>

<script type="module">
import * as THREE from 'three';

/* ---------------------------------------------------------------------------
   Springs: every animatable value is a damped spring chasing a target.
   Expressions only set targets; the springs supply overshoot, follow-through
   and settle, which is where most of the "alive" feel comes from.
--------------------------------------------------------------------------- */
const PRESET = {
  body:   [120, 16],
  jelly:  [260, 13],
  face:   [300, 30],
  mouth:  [320, 28],
  pop:    [280, 15],
  snap:   [700, 48],
  fast:   [500, 30],
  slow:   [26, 10],
  drift:  [14, 7.2],
  blink:  [1600, 75],
  gaze:   [650, 46],
  melt:   [55, 13],   // cube shrinking into / growing out of the dots
  spread: [70, 7],    // dots pulling apart: a little wobble as they pinch off
  ear:    [200, 11],  // ears: light, a beat behind the head, a small flick before they settle
};

const DEFAULTS = {
  // body (cube-local units, radians)
  x: [0, 'body'], y: [0, 'body'], z: [0, 'body'],
  rx: [0, 'body'], ry: [0, 'body'], rz: [0, 'body'],
  sq: [1, 'jelly'], lean: [0, 'body'], leanZ: [0, 'body'],
  twist: [0, 'body'], inflate: [0.17, 'pop'], scale: [1, 'body'],
  // face (px in a 512 face canvas, origin at centre)
  gx: [0, 'gaze'], gy: [0, 'gaze'], eLx: [0, 'gaze'], eRx: [0, 'gaze'],  // per-eye x offset (px): converging on a pointer up close
  eyeSep: [96, 'face'], eyeY: [-34, 'face'], eyeW: [64, 'face'], eyeH: [112, 'face'], eyeR: [0.92, 'face'],
  eL: [1, 'face'], eR: [1, 'face'], close: [0, 'face'], blink: [0, 'blink'],
  lidT: [0, 'face'], lidA: [0, 'face'], happy: [0, 'face'], calm: [0, 'face'], peek: [0, 'face'],
  swirl: [0, 'face'],  // eyes turn into spinning spirals (Dizzy)
  // mouth: only Yawn shows one (mouthOn), a dot that opens into a round yawn
  mouthOn: [0, 'face'], mW: [0, 'mouth'], mO: [0, 'mouth'], mY: [92, 'mouth'], mT: [15, 'mouth'],
  wall: [0, 'body'],  // invisible wall to hide behind (Hiding)
  // liquid loader: cube melted away, dots pulled apart, dot size, bouncing
  dSpread: [0, 'spread'], dR: [0, 'pop'], dBounce: [0, 'body'],
  // ears (radians), left and right: B = tip tilts back, O = tip tilts out to the
  // side, T = the ear swivels on its base to face out. Expressions set them with
  // ears / earL / earR: [B, O, T]; each ear always moves on its own light spring.
  eLB: [0.1, 'ear'], eRB: [0.1, 'ear'], eLO: [0, 'ear'], eRO: [0, 'ear'], eLT: [0, 'ear'], eRT: [0, 'ear'],
};

const P = {};
for (const [k, [v, preset]] of Object.entries(DEFAULTS)) {
  const [stiff, damp] = PRESET[preset];
  P[k] = { v, vel: 0, base: v, off: 0, k: stiff, d: damp, preset };
}
function resetTargets() {
  for (const [k, [v, preset]] of Object.entries(DEFAULTS)) {
    const s = P[k];
    s.base = v;
    [s.k, s.d] = PRESET[preset];
  }
}
function stepSprings(dt) {
  for (const k in P) {
    const s = P[k];
    const a = s.k * (s.base + s.off - s.v) - s.d * s.vel;
    s.vel += a * dt;
    s.v += s.vel * dt;
  }
}
const V = (k) => P[k].v;

/* ---------------------------------------------------------------------------
   Deformation of the body and face on the GPU.
   inflate → cube-to-sphere, twist, squash/stretch (bottom pivot), bend.
--------------------------------------------------------------------------- */
const U = {
  uInflate: { value: 0 }, uTwist: { value: 0 },
  uSq: { value: 1 }, uLean: { value: 0 }, uLeanZ: { value: 0 },
  uW: { value: 1 }, uH: { value: 1 },  // body width / height (LOOK)
};

const DEFORM_GLSL = /* glsl */`
uniform float uInflate, uTwist, uSq, uLean, uLeanZ, uW, uH;
vec3 deformP(vec3 p) {
  p = mix(p, normalize(p) * 0.62, uInflate);
  p.x *= uW;
  p.z *= uH;  // as deep as it is tall
  p.y = (p.y + 0.5) * uH - 0.5;
  float a = uTwist * p.y; float c = cos(a), s = sin(a);
  p.xz = vec2(c * p.x + s * p.z, -s * p.x + c * p.z);
  p.y = (p.y + 0.5) * uSq - 0.5;
  p.xz *= inversesqrt(uSq);
  float h = p.y + 0.5;
  p.x += uLean * h * h;
  p.z += uLeanZ * h * h;
  return p;
}
vec3 deformN(vec3 p, vec3 n) {
  n = normalize(n);
  vec3 r = abs(n.y) < 0.95 ? vec3(0., 1., 0.) : vec3(1., 0., 0.);
  vec3 t1 = normalize(cross(n, r));
  vec3 t2 = cross(n, t1);
  float e = 0.003;
  vec3 d0 = deformP(p);
  return normalize(cross(deformP(p + t1 * e) - d0, deformP(p + t2 * e) - d0));
}
`;

// An ear bends about its base before it takes the body's deform, so it squashes,
// leans and twists with the body like part of it. The bend grows toward the
// tip, so it curls rather than hinging.
const EAR_GLSL = /* glsl */`
uniform vec3 uEarBase, uEarTilt; uniform float uEarSide, uEarH;
mat3 earRot(vec3 p) {
  float s = 0.35 + 0.65 * clamp((p.y - uEarBase.y) / uEarH, 0., 1.);
  float b = -uEarTilt.x * s, o = -uEarTilt.y * uEarSide * s, t = uEarTilt.z * uEarSide;
  mat3 rx = mat3(1., 0., 0., 0., cos(b), sin(b), 0., -sin(b), cos(b));
  mat3 rz = mat3(cos(o), sin(o), 0., -sin(o), cos(o), 0., 0., 0., 1.);
  mat3 ry = mat3(cos(t), 0., -sin(t), 0., 1., 0., sin(t), 0., cos(t));  // swivel, whole ear
  return rz * rx * ry;
}
vec3 earP(vec3 p) { return uEarBase + earRot(p) * (p - uEarBase); }
vec3 earN(vec3 p, vec3 n) { return earRot(p) * n; }
`;

function deformed(material, { offset = 0, key, ear }) {
  // an ear's own uniforms (base, tilt), or none for the body and face
  const pos = ear ? 'earP(position)' : 'position', nor = ear ? 'earN(position, normal)' : 'normal';
  material.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, U, ear);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\n' + DEFORM_GLSL + (ear ? EAR_GLSL : ''))
      .replace('#include <begin_vertex>',
        offset
          ? `vec3 transformed = deformP(${pos}) + deformN(${pos}, ${nor}) * ${offset.toFixed(4)};`
          : `vec3 transformed = deformP(${pos});`);
    if (!offset) {
      shader.vertexShader = shader.vertexShader.replace('#include <beginnormal_vertex>',
        `vec3 objectNormal = deformN(${pos}, ${nor});\n#ifdef USE_TANGENT\nvec3 objectTangent = vec3(tangent.xyz);\n#endif`);
    }
  };
  material.customProgramCacheKey = () => key;
  return material;
}

/* ---------------------------------------------------------------------------
   Scene
--------------------------------------------------------------------------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, premultipliedAlpha: true });
// Always 2x: on a 1x display the browser scales it down, which smooths the edges that
// antialias: false leaves jagged (the outline pass needs it off); on Retina it's the screen's own.
renderer.setPixelRatio(2);
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);

const fxCanvas = document.createElement('canvas');
stage.appendChild(fxCanvas);
const fx = fxCanvas.getContext('2d');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 50);

/* The cube is still 3D underneath, but it's drawn nearly flat and outlined in
   screen space: one pass renders body coverage (R) and face ink (G), then a
   full-screen composite adds the outline where the blurred coverage crosses
   0.5, so turning reads as a changing silhouette. The body's R also carries
   how much light it gets (0.5 = in shadow, 1 = lit) from a soft light above
   left and in front: the composite turns that into a faint shade on the sides
   (uShade), so it reads as a solid without visible edges. */
const LIGHT = new THREE.Vector3(-0.3, 0.45, 1).normalize();  // in view space
const fillMat = (ear) => {
  const m = new THREE.MeshBasicMaterial({ color: 0xff0000, toneMapped: false });
  deformed(m, { key: ear ? 'fill-ear' : 'fill', ear });
  const base = m.onBeforeCompile;
  m.onBeforeCompile = (shader, r) => {
    base(shader, r);
    shader.uniforms.uLight = { value: LIGHT };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vShadeN;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvShadeN = normalize(normalMatrix * ' + (ear ? 'deformN(earP(position), earN(position, normal))' : 'deformN(position, normal)') + ');');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vShadeN;\nuniform vec3 uLight;')
      .replace('#include <dithering_fragment>', `#include <dithering_fragment>
        float lit = smoothstep(0.15, 0.85, dot(normalize(vShadeN), uLight));
        gl_FragColor = vec4(0.5 + 0.5 * lit, 0.0, 0.0, 1.0);`);
  };
  return m;
};

const COMPOSITE_FRAG = /* glsl */`
precision highp float;
uniform sampler2D tFill;
uniform vec2 uRes; uniform float uPx, uLineScale;
uniform vec4 uWall;      // hiding wall (Hiding): rounded pillar box x0, y0, x1, y1 in framebuffer px
uniform float uWallOn;
uniform vec3 uFillCol, uInkCol, uSilCol;
uniform float uShade;    // how much darker the side away from the light gets
// liquid loader: the cube's blurred shape is added to three soft dots and the
// sum is cut at 0.5, so they merge and pinch apart like liquid
uniform float uLoader;   // 1 while the dots are in play
uniform float uMelt;     // 0 = all cube, 1 = cube shrunk away, only dots
uniform vec3 uDot[3];    // x, y, radius in framebuffer px
uniform float uGoo;      // how far each dot's pull reaches (px): bigger = gooier

// coverage: R is light (0.5-1) wherever the body is, so any R counts as covered
// light on the body at a pixel (1 where there's no body)
float litAt(vec4 f) {
  return f.r > 0.01 ? clamp((f.r / max(1.0 - f.g, 0.02) - 0.5) * 2.0, 0., 1.) : 1.0;
}
// blurred coverage; the outline is the band where it crosses 0.5. Also the
// average light on the covered samples, so the outline takes the shade of
// the body beside it instead of ringing it in bright white.
// Two rings of 24 (the inner one at half the radius, turned half a step) and
// the centre. 12 per ring was enough for the body, but small shapes like the
// ears slipped between the samples and the outline frayed into streaks there,
// most of all at the app's small size.
float blurLit;
float blurred(vec2 px, float r) {
  float a = 0.0, l = 0.0;
  for (int i = 0; i < 49; i++) {
    float t = float(i) * 0.2618 + (i < 24 ? 0.0 : 0.1309);
    vec2 o = i == 48 ? vec2(0.0) : vec2(cos(t), sin(t)) * r * (i < 24 ? 1.0 : 0.5);
    vec4 f = texture2D(tFill, (px + o) / uRes);
    float c = clamp(step(0.01, f.r) + f.g, 0., 1.);
    a += c; l += c * litAt(f);
  }
  blurLit = a > 0.0 ? l / a : 1.0;
  return a / 49.0;
}
// smooth union: two shapes closer than k grow a liquid bridge between them
float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}
// the dots as a coverage that ramps over the same width (2r) as the cube's
// blurred coverage, so the two blend evenly and the outline keeps its width
float dots(vec2 px, float r) {
  float d = length(px - uDot[0].xy) - uDot[0].z;
  d = smin(d, length(px - uDot[1].xy) - uDot[1].z, uGoo);
  d = smin(d, length(px - uDot[2].xy) - uDot[2].z, uGoo);
  return 1.0 - smoothstep(-r, r, d);
}

void main() {
  vec2 px = gl_FragCoord.xy;
  vec4 f = texture2D(tFill, px / uRes);
  float fill = clamp(step(0.01, f.r) + f.g, 0., 1.);
  // light on the body, undoing the face ink laid over it (R * (1 - ink))
  vec3 body = uFillCol * (1.0 - uShade * (1.0 - litAt(f)));
  float r = uPx * uLineScale * 1.35;  // the outline's reach: ~1.5 CSS px at the app's size; keep render()'s copy in step
  float a = blurred(px, r);
  float e, ink = f.g;
  vec3 col;
  if (uLoader > 0.5) {
    // the shape is wherever the blend of cube and dots passes 0.5
    // the shrunken cube fades out completely, so no speck is left behind the dots
    a = clamp(a * (1.0 - smoothstep(0.8, 0.98, uMelt)) + dots(px, r), 0., 1.);
    fill = smoothstep(0.44, 0.56, a);
    ink = min(ink * (1.0 - uMelt), fill);
    // its shading goes early, by the time it's a small ball, on the body and on
    // the edge: still on, the shrunken cube shows as a grey speck in the middle dot
    float unshade = smoothstep(0.0, 0.4, uMelt);
    body = mix(body, uFillCol, unshade);
    blurLit = mix(blurLit, 1.0, unshade);
  }
  e = 1.0 - smoothstep(0.32, 0.48, abs(a - 0.5));
  vec3 sil = uSilCol * (1.0 - uShade * (1.0 - blurLit));
  col = mix(mix(body, uInkCol, ink), sil, e);
  // premultiplied: the shape keeps its own colour right to its anti-aliased
  // edge, and only the uncovered part of a pixel shows the outline stroke
  float alpha = fill + e * (1.0 - fill);
  vec3 premul = col * fill + sil * e * (1.0 - fill);
  // worn objects (B): plain ink laid on top, outside the outline entirely
  float worn = clamp(f.b, 0., 1.);
  premul = uInkCol * worn + premul * (1.0 - worn);
  alpha = worn + alpha * (1.0 - worn);

  // wall (Hiding): an invisible pillar in front of the mascot
  vec2 wc = (uWall.xy + uWall.zw) * 0.5, wh = (uWall.zw - uWall.xy) * 0.5;
  float wr = 14.0 * uPx;
  vec2 wq = abs(px - wc) - wh + wr;
  float wd = length(max(wq, 0.0)) + min(max(wq.x, wq.y), 0.0) - wr;
  float w = (1.0 - smoothstep(-uPx, uPx, wd)) * uWallOn;
  premul *= 1.0 - w;  // same as the background: it just hides what's behind it
  alpha *= 1.0 - w;
  gl_FragColor = vec4(premul, alpha);
}`;

// no MSAA: the fill's edge hides under a same-coloured outline whose own edge
// comes from blurred coverage, so multisampling would cost power for nothing
const fillRT = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: true });

// colours go straight to the framebuffer, so keep them in sRGB
const srgb = (hex) => new THREE.Color().setHex(hex, THREE.LinearSRGBColorSpace);
const compositeMat = new THREE.ShaderMaterial({
  uniforms: {
    tFill: { value: fillRT.texture },
    uRes: { value: new THREE.Vector2(1, 1) }, uPx: { value: 1 }, uLineScale: { value: 1 },
    uWall: { value: new THREE.Vector4() }, uWallOn: { value: 0 },
    uLoader: { value: 0 }, uMelt: { value: 0 }, uGoo: { value: 1 },
    uDot: { value: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()] },
    uFillCol: { value: srgb(0xf1f1ee) }, uInkCol: { value: srgb(0x0d0d0e) }, uSilCol: { value: srgb(0xf1f1ee) },
    uShade: { value: 0.16 },
  },
  vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: COMPOSITE_FRAG,
  depthTest: false, depthWrite: false,
});
const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compositeMat));

// Rounded cube with an even grid on every face, so twist/bend actually curve the faces.
function roundedCube(size = 1, radius = 0.13, seg = 40) {
  const g = new THREE.BoxGeometry(size, size, size, seg, seg, seg);
  const pos = g.attributes.position, nor = g.attributes.normal;
  const h = size / 2 - radius, p = new THREE.Vector3(), q = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i);
    q.set(THREE.MathUtils.clamp(p.x, -h, h), THREE.MathUtils.clamp(p.y, -h, h), THREE.MathUtils.clamp(p.z, -h, h));
    n.subVectors(p, q).normalize();
    p.copy(q).addScaledVector(n, radius);
    pos.setXYZ(i, p.x, p.y, p.z);
    nor.setXYZ(i, n.x, n.y, n.z);
  }
  return g;
}

const BASE_Y = -0.12;
const rig = new THREE.Group(); scene.add(rig);
// where the cube would be without backing off from an icky pointer: the
// distance to the pointer is measured from here, so backing off doesn't feed back
const home = new THREE.Object3D(); scene.add(home);
const body = new THREE.Mesh(roundedCube(1, 0.23), fillMat());
rig.add(body);

// Face: a 2D canvas redrawn every frame, laid on the front face and deformed with it.
const FACE_PX = 512, FACE_UNITS = 0.8;
const faceCanvas = document.createElement('canvas');
faceCanvas.width = faceCanvas.height = FACE_PX;
const fc = faceCanvas.getContext('2d');
const faceTex = new THREE.CanvasTexture(faceCanvas);
faceTex.colorSpace = THREE.SRGBColorSpace;
faceTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const faceGeo = new THREE.PlaneGeometry(FACE_UNITS, FACE_UNITS, 24, 24).translate(0, 0, 0.5);
const faceMat = deformed(new THREE.MeshBasicMaterial({
  map: faceTex, transparent: true, depthWrite: false,
  polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, toneMapped: false,

const EAR = { x: 0.26, z: -0.04, w: 0.095, d: 0.05, h: 0.14, sink: 0.1, tipIn: 0.55, tipR: 0.004 };

// Point on the deformed body (same maths as the body's vertex shader), so
// the loader dots stay centred on it while it squashes, leans and twists.
function deformPoint(x, y, z) {
  const inf = U.uInflate.value;
  if (inf) {
    const l = Math.hypot(x, y, z) || 1;
    x += (x / l * 0.62 - x) * inf; y += (y / l * 0.62 - y) * inf; z += (z / l * 0.62 - z) * inf;
  }
  x *= U.uW.value; z *= U.uH.value;
  y = (y + 0.5) * U.uH.value - 0.5;
  const a = U.uTwist.value * y, c = Math.cos(a), sn = Math.sin(a);
  [x, z] = [c * x + sn * z, -sn * x + c * z];
  const sq = U.uSq.value;
  y = (y + 0.5) * sq - 0.5;
  const inv = 1 / Math.sqrt(sq); x *= inv; z *= inv;
  const h = y + 0.5;
  return new THREE.Vector3(x + U.uLean.value * h * h, y, z + U.uLeanZ.value * h * h);
}

/* ---------------------------------------------------------------------------
   Face drawing (black ink on transparent, 512-unit space centred at 0,0)
--------------------------------------------------------------------------- */
const INK = '#00ff00';     // face ink lands in the G channel of the fill pass
const eyeBuf = document.createElement('canvas'); eyeBuf.width = eyeBuf.height = 512;
const eb = eyeBuf.getContext('2d');

function pill(ctx, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, r); ctx.fill();
}

function drawEye(side, time) {
  const g = eb; // eye buffer, scale 2 → 256-unit space centred
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, 512, 512);
  g.setTransform(2, 0, 0, 2, 256, 256);
  g.fillStyle = INK; g.strokeStyle = INK;

  const per = side < 0 ? V('eL') : V('eR');
  const H0 = Math.max(V('eyeH'), 1);
  const hBase = H0 * per;
  const calm = THREE.MathUtils.clamp(V('calm') - (side > 0 ? V('peek') : 0), 0, 1);  // peek opens the right eye
  const shut = Math.min(1, Math.max(V('close'), V('blink'), calm));
  const h = Math.max(hBase * (1 - shut), 11);
  const squashed = THREE.MathUtils.clamp(1 - h / H0, 0, 1);
  const w = V('eyeW') * (1 + 0.32 * squashed);

  const swirl = THREE.MathUtils.clamp(V('swirl'), 0, 1);
  g.globalAlpha = (1 - THREE.MathUtils.clamp((calm - 0.3) / 0.5, 0, 1)) * (1 - swirl);
  pill(g, w, h, Math.min(w, h) / 2 * V('eyeR'));
  // swirl: a spinning spiral fades in over the eye, the eyes turning opposite ways
  if (swirl > 0.01) {
    g.save(); g.globalAlpha = swirl;
    g.rotate(time * 9 * side);
    g.lineWidth = 7; g.lineCap = 'round';
    const R = Math.min(w, h) / 2 - 3, turns = 2.4;
    g.beginPath();
    for (let a = 0; a <= turns * TAU; a += 0.25) { const r = R * a / (turns * TAU); g.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    g.stroke(); g.restore();
    g.globalAlpha = 1 - swirl;
  }
  // lids: erase above a sloped line (angry/sad/sleepy)
  const lidT = V('lidT'), lidA = V('lidA');
  if (lidT > 0.005 || Math.abs(lidA) > 0.01) {
    g.globalCompositeOperation = 'destination-out';
    const y0 = -h / 2 + lidT * h;
    g.save(); g.translate(0, y0); g.rotate(-side * lidA);
    g.fillRect(-200, -400, 400, 400);
    g.restore();
    g.globalCompositeOperation = 'source-over';
  }
  // happy: erase a disc from below, leaving a ^ crescent
  const hp = V('happy');
  if (hp > 0.01) {
    g.globalCompositeOperation = 'destination-out';
    const rr = w * 0.78;
    g.beginPath(); g.arc(0, h / 2 + rr - hp * h * 0.78, rr, 0, Math.PI * 2); g.fill();
    g.globalCompositeOperation = 'source-over';
  }
  // catchlight: a small reflection dot in the upper right of an open eye. It's
  // a light up and to the right of you, so it stays put while the head moves:
  // turned left, it slides out toward the right edge; turned right, back toward
  // the middle (never all the way); head down, it rides up; head up, a little down.
  const shine = THREE.MathUtils.clamp((h - 30) / 40, 0, 1) * (1 - THREE.MathUtils.clamp(V('happy'), 0, 1)) * (1 - calm) * (1 - swirl);
  if (shine > 0.02) {
    const C = THREE.MathUtils.clamp, wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
    const turn = C(-wrap(rig.rotation.y) / 0.35, -1, 1), tilt = C(wrap(rig.rotation.x) / 0.22, -1, 1);
    const dr = Math.min(w, h) * 0.17 * shine;
    let dx = w * (0.25 + (turn > 0 ? 0.18 : 0.22) * turn), dy = h * (-0.28 - (tilt > 0 ? 0.12 : 0.14) * tilt);
    // kept inside the eye, sliding round its rounded corner rather than poking out
    const R = Math.min(w, h) / 2 * V('eyeR'), m = 1;
    const ix = Math.max(0, w / 2 - dr - m), iy = Math.max(0, h / 2 - dr - m), ir = Math.max(0, R - dr - m);
    dx = C(dx, -ix, ix); dy = C(dy, -iy, iy);
    const cx = Math.max(0, ix - ir), cy = Math.max(0, iy - ir);
    const ox = Math.abs(dx) - cx, oy = Math.abs(dy) - cy;
    if (ox > 0 && oy > 0 && Math.hypot(ox, oy) > ir) {
      const k = ir / Math.hypot(ox, oy);
      dx = Math.sign(dx) * (cx + ox * k); dy = Math.sign(dy) * (cy + oy * k);
    }
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'destination-out';
    g.beginPath(); g.arc(dx, dy, dr, 0, Math.PI * 2); g.fill();
  }

  // calm: eyes closed into a soft ‿, like a content or unwilling dog
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = THREE.MathUtils.clamp((calm - 0.2) / 0.5, 0, 1);
  if (g.globalAlpha > 0) {
    const d = 26 * calm;

    g.beginPath(); g.moveTo(-w * 0.55, -d * 0.3); g.quadraticCurveTo(0, d, w * 0.55, -d * 0.3); g.stroke();
  }
  g.globalAlpha = 1;
}

// Mouth: only Yawn has one, a dot under the eyes that opens into a round O.
function drawMouth(ctx) {
  if (V('mouthOn') < 0.5) return;
  const o = Math.max(0, V('mO')), r = 6 + Math.max(0, V('mW')) * 0.26 * o;
  ctx.save();

// Everything the face drawing reads. When none of it moved by a visible amount,
// the canvas and its GPU upload are skipped.
const FACE_KEYS = ['gx', 'gy', 'eLx', 'eRx', 'eyeSep', 'eyeY', 'eyeW', 'eyeH', 'eyeR', 'eL', 'eR', 'close', 'blink',

  // spinning spirals change every frame even when nothing else moves
  const spinning = V('swirl') > 0.02 ? Math.round(time * 30) : 0;
  const sig = FACE_KEYS.map((k) => Math.round(V(k) * 50)).join() + U.uW.value + U.uH.value + spinning;
  if (sig === faceSig) return;
  faceSig = sig;
  fc.setTransform(1, 0, 0, 1, 0, 0);
  fc.clearRect(0, 0, FACE_PX, FACE_PX);
  const s = FACE_PX / 512 * 1.28;
  fc.setTransform(s, 0, 0, s, FACE_PX / 2, FACE_PX / 2 + 10);

  fc.fillStyle = INK; fc.strokeStyle = INK;
  for (const side of [-1, 1]) {
    drawEye(side, time);
    const cx = side * V('eyeSep') + V('gx') + V(side < 0 ? 'eLx' : 'eRx'), cy = V('eyeY') + V('gy');
    fc.drawImage(eyeBuf, cx - 128, cy - 128, 256, 256);
  }
  drawMouth(fc);

}

const particles = [];
const tmpV = new THREE.Vector3();
function spawn(type, opts = {}) {

}
const FX = {
  z: () => spawn('z', { life: 2.2, anchor: new THREE.Vector3(0.42, 0.55, 0.3) }),
  q: () => spawn('q', { life: 2.4 }),
  bang: () => spawn('bang', { life: 1.6, anchor: new THREE.Vector3(0.52, 0.7, 0.3) }),
  sparkle: () => { for (let i = 0; i < 4; i++) spawn('spark', { life: 1.1, delay: i * 0.12, anchor: new THREE.Vector3((Math.random() < .5 ? -1 : 1) * (0.62 + Math.random() * 0.2), 0.1 + Math.random() * 0.6, 0.3) }); },
  anger: () => spawn('anger', { life: 2.4, anchor: new THREE.Vector3(0.42, 0.52, 0.5) }),
  dots: () => spawn('dots', { life: 2.6, anchor: new THREE.Vector3(0, 0.78, 0.2) }),
  huff: () => spawn('huff', { life: 0.9, anchor: new THREE.Vector3(-0.42, -0.12, 0.55) }),
  sweat: () => spawn('sweat', { life: 1.8, anchor: new THREE.Vector3(-0.52, 0.42, 0.4) }),
  stars: () => spawn('stars', { life: 2.4, anchor: new THREE.Vector3(0, 0.66, 0) }),

function flyAt(t) {
  const v = new THREE.Vector3(0.95 * Math.sin(t * 1.7 + 0.6), 0.3 + 0.32 * Math.sin(t * 3.1), 0.7);
  if (t > 3) { const k = t - 3; v.x += k * k * 3; v.y += k * 1.5; }

}
FX.fly = () => spawn('fly', { life: 3.6, path: flyAt });
const easeOutBack = (t) => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);

let fxDirty = false;
function drawFX(unitPx) {
  const dpr = renderer.getPixelRatio();
  if (!particles.length && !fxDirty) return;
  fxDirty = particles.length > 0;
  fx.setTransform(1, 0, 0, 1, 0, 0);
  fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = fxCanvas.width / dpr, Hh = fxCanvas.height / dpr;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const age = clock - p.t0 - (p.delay || 0);
    if (age > p.life) { particles.splice(i, 1); continue; }
    if (age < 0) continue;
    const t = age / p.life;
    if (p.path) tmpV.copy(p.path(age)); else { tmpV.copy(p.anchor); rig.localToWorld(tmpV); }
    tmpV.project(camera);
    let x = (tmpV.x * 0.5 + 0.5) * W, y = (-tmpV.y * 0.5 + 0.5) * Hh;
    const u = unitPx;
    const fade = Math.min(1, age * 6) * (1 - Math.max(0, (t - 0.75) / 0.25));
    fx.save(); fx.globalAlpha = fade; fx.fillStyle = '#f4f4f4'; fx.strokeStyle = '#f4f4f4';
    fx.lineCap = 'round'; fx.lineJoin = 'round';
    switch (p.type) {
      case 'z': {
        x += u * (0.25 * t + 0.05 * Math.sin(age * 4)); y -= u * 0.45 * t;
        fx.font = `600 ${u * (0.12 + 0.12 * t)}px -apple-system, system-ui`;
        fx.fillText('z', x, y); break;
      }
      case 'q': case 'bang': {
        const s = easeOutBack(Math.min(1, age * 3.2));
        fx.translate(x, y); fx.rotate(Math.sin(age * 5) * 0.12 * (1 - t)); fx.scale(s, s);
        fx.font = `700 ${u * 0.3}px -apple-system, system-ui`; fx.textAlign = 'center';
        fx.fillText(p.type === 'q' ? '?' : '!', 0, 0); break;
      }

        }
        fx.closePath(); fx.fill(); break;

      case 'anger': {

          fx.moveTo(s * 0.25, -s); fx.quadraticCurveTo(s * 0.25, -s * 0.25, s, -s * 0.25); fx.stroke(); fx.restore();
        }
        break;
      }
      case 'dots': {
        for (let k = 0; k < 3; k++) {
          const b = Math.max(0, Math.sin(age * 7 - k * 0.9));
          fx.beginPath(); fx.arc(x + (k - 1) * u * 0.1, y - b * u * 0.05, u * 0.026, 0, Math.PI * 2); fx.fill();
        }
        break;
      }
      case 'stars': {
        // three sparkles on a flat orbit over the head; the ones behind are smaller
        for (let k = 0; k < 3; k++) {
          const a = age * 4.2 + k * TAU / 3, depth = 0.75 + 0.25 * Math.sin(a);

            fx.lineTo(Math.cos(b + Math.PI / 4) * s * 0.3, Math.sin(b + Math.PI / 4) * s * 0.3);
          }
          fx.closePath(); fx.fill(); fx.restore();
        }
        break;
      }
      case 'sweat': {
        y += u * 0.12 * t * t;

        fx.translate(x, y); fx.beginPath();
        fx.moveTo(0, -s * 1.4); fx.quadraticCurveTo(s, 0, 0, s * 0.8); fx.quadraticCurveTo(-s, 0, 0, -s * 1.4);

      }

  }
}

    ],
    proc(t, add) {

      add('rz', Math.sin(t * 13 + 1) * 0.018 * e);

      add('eLO', Math.sin(t * 13) * 0.28 * e); add('eRO', -Math.sin(t * 13) * 0.28 * e);
    },
  },

    // the head turns slightly left, as if pointing an ear at the screen,
    // while the eyes stay on you

    keys: [

      // the near ear pricks up and swivels toward the sound, the other relaxes

    ],

  // further from you, with a slight tilt away
  const g = ICK_GAIN;
  rig.position.set(V('x') - ick.x * 0.22 * g, BASE_Y + V('y') - ick.y * 0.1 * g, V('z') - ick.k * 0.12 * g);
  rig.rotation.set(V('rx') + ick.y * 0.08 * g, V('ry') + V('gx') * 0.0018 - ick.x * 0.3 * g, V('rz') + ick.x * 0.09 * g, 'YXZ');
  rig.scale.setScalar(V('scale'));
  home.position.set(V('x'), BASE_Y + V('y'), V('z'));
  home.rotation.set(V('rx'), V('ry') + V('gx') * 0.0018, V('rz'), 'YXZ');
  home.scale.copy(rig.scale);
  for (const e of ears) {
    const l = e.userData.u.uEarSide.value < 0;
    // never tipped forward over the face: that's when they read as a pig's
    e.userData.u.uEarTilt.value.set(Math.max(-0.15, V(l ? 'eLB' : 'eRB')), V(l ? 'eLO' : 'eRO'), V(l ? 'eLT' : 'eRT'));
  }
  home.updateMatrixWorld();
  updateWall();
}
// Pillar (world units): it never moves; its right edge sits just past the
// cube's left side, so the cube has to walk over to hide behind it.
const WALL = { x: -0.53, w: 0.8, top: 0.62, bottom: -0.8 };
function updateWall() {
  const k = V('wall'), u = compositeMat.uniforms;
  u.uWallOn.value = k > 0.5 ? 1 : 0;
  if (k <= 0.5) return;
  const x1 = WALL.x;
  const toPx = (x, y) => {
    const p = new THREE.Vector3(x, y, 0).project(camera), r = renderer.getPixelRatio();
    return [(p.x * 0.5 + 0.5) * innerWidth * r, (p.y * 0.5 + 0.5) * innerHeight * r];
  };
  const [ax, ay] = toPx(x1 - WALL.w, WALL.bottom), [bx, by] = toPx(x1, WALL.top);
  u.uWall.value.set(ax, ay, bx, by);
}

/* ---------------------------------------------------------------------------
   Pointer and look
--------------------------------------------------------------------------- */
function moved(px, py) {
  if (pointer.active) pointerTravel += Math.hypot(px - pointer.px, py - pointer.py);
  pointer.px = px; pointer.py = py;
  pointer.active = true; pointer.t = clock; glanced = false; glanceEnd = -1;
  trackSpin(px, py); trackWhip(px);
}
// Past the frame's edge the head keeps turning, easing off the further out the
// pointer goes (1.18x the edge one frame-width out, 1.26x at four), topping
// out at 1.35x so a cursor across the screen doesn't wrench the head round.
const soften = (v) => (Math.abs(v) <= 1 ? v : Math.sign(v) * (1.35 - 0.35 / Math.abs(v)));
// Oby follows the pointer inside its own frame, until the host starts feeding
// it with look(): from then on that's the only source, so the two never fight
// at the frame's edge.
let hostLooks = false;
addEventListener('pointermove', (e) => {
  if (hostLooks) return;
  pointer.x = (e.clientX / innerWidth) * 2 - 1; pointer.y = -((e.clientY / innerHeight) * 2 - 1);
  moved(e.clientX, e.clientY);
});
document.addEventListener('pointerleave', () => { if (!hostLooks) pointer.active = false; });

// The look everyone gets. ?size=1.4 makes Oby bigger in its frame (lines thin
// out a little as it shrinks); at 1 it leaves room around it to move.
const params = new URLSearchParams(location.search);
const LOOK = { size: parseFloat(params.get('size')) || 1, round: 0.23, width: 0.93, height: 0.75, earLen: 0.14, earTip: 0.004 };
let size = LOOK.size;
function setSize(v) {
  size = v;
  compositeMat.uniforms.uLineScale.value = 0.5 + 0.5 * v;
  resize();
}
// Shape: corner roundness rebuilds the body; width/height feed the deform.
const SHAPE = {
  round: (v) => { body.geometry.dispose(); body.geometry = roundedCube(1, v); },
  width: (v) => { U.uW.value = v; },
  height: (v) => { U.uH.value = v; },
  earLen: (v) => { EAR.h = v; rebuildEars(); },
  earTip: (v) => { EAR.tipR = v; rebuildEars(); },
};
for (const [k, apply] of Object.entries(SHAPE)) apply(LOOK[k]);
let showPlaying = () => {};  // the playground shows what's playing

let unitPx = 100;
function resize() {
  const w = innerWidth, h = innerHeight, dpr = renderer.getPixelRatio();
  renderer.setSize(w, h, false);
  const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
  fillRT.setSize(bw, bh);
  compositeMat.uniforms.uRes.value.set(bw, bh);
  compositeMat.uniforms.uPx.value = dpr;
  fxCanvas.width = w * dpr; fxCanvas.height = h * dpr;
  camera.aspect = w / h;
  // fit a 2.6 x 2.6 unit box regardless of aspect; leave room for the chip bar
  const uiH = document.getElementById('ui')?.offsetHeight || 0;
  const fitH = 2.6 * h / Math.max(1, h - uiH);
  const needH = Math.max(fitH, 2.6 / camera.aspect) / size;
  const dist = needH / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const shift = (uiH / h) * needH / 2;
  camera.position.set(0, -shift, dist);
  camera.lookAt(0, -shift, 0);
  camera.updateProjectionMatrix();
  unitPx = h / needH;
}
addEventListener('resize', resize);
setSize(size);

/* dev:start ----------------------------------------------------------------
   Playground: state buttons, expression buttons, look sliders (saved in this
   browser), and a toggle to hide them. ?embed hides all of it.
--------------------------------------------------------------------------- */
{
  let nextIdx = 0;
  const embedded = params.has('embed');
  const label = document.getElementById('label');
  const chips = document.getElementById('chips');
  const stateChips = document.getElementById('states');
  for (const name of Object.keys(STATES)) {
    const b = document.createElement('button');
    b.className = 'chip auto'; b.textContent = name; b.dataset.state = name;
    b.onclick = () => oby.setState(name, { now: true });
    stateChips.appendChild(b);
  }
  EXPRESSIONS.forEach((e, i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = e.name; b.dataset.i = i;
    b.onclick = () => oby.play(e.name);
    chips.appendChild(b);
  });
  showPlaying = () => {
    label.textContent = `${state} · ${cur === IDLE ? 'idle' : cur.name}`;
    for (const b of chips.querySelectorAll('.chip[data-i]')) b.classList.toggle('on', EXPRESSIONS[b.dataset.i] === cur);
    for (const b of stateChips.children) b.classList.toggle('on', b.dataset.state === state);
  };
  addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'ArrowRight') { oby.play(EXPRESSIONS[nextIdx].name); nextIdx = (nextIdx + 1) % EXPRESSIONS.length; }
  });

  if (params.has('nochips')) document.getElementById('ui').style.display = 'none';
  // ?embed hides the controls in CSS (html.embed), before the first paint
  // Controls toggle: hidden by default in the menu bar app (loaded from a file),
  // open in the browser; the choice is remembered.
  let open = location.protocol !== 'file:';
  try { const saved = localStorage.getItem('cube.ui'); if (saved !== null) open = saved === '1'; } catch {}
  document.body.classList.toggle('collapsed', !open);
  document.getElementById('uiToggle').onclick = () => {
    const nowOpen = document.body.classList.toggle('collapsed') === false;
    try { localStorage.setItem('cube.ui', nowOpen ? '1' : '0'); } catch {}
    resize();
  };

  // Sliders: start from LOOK (size starts smaller here, to leave room for the
  // controls), then whatever this browser saved. Reset goes back to the start.
  const fmt = {
    size: (v) => Math.round(v * 100) + '%',
    round: (v) => Math.round((v - 0.04) / 0.42 * 100) + '%',
    width: (v) => v.toFixed(2) + '×',
    height: (v) => v.toFixed(2) + '×',
    earLen: (v) => v.toFixed(2),
    earTip: (v) => Math.round((v - 0.004) / 0.056 * 100) + '%',  // how round the tip is
  };
  const apply = { size: setSize, ...SHAPE };
  for (const k of Object.keys(fmt)) {
    const input = document.querySelector(`[data-k=${k}] input`), out = document.querySelector(`[data-k=${k}] output`);
    if (k !== 'size') input.defaultValue = LOOK[k];
    input.value = embedded && k === 'size' ? LOOK.size : input.defaultValue;
    if (!embedded) {
      let saved = NaN;
      try { saved = parseFloat(localStorage.getItem('cube.' + k)); } catch {}
      if (!Number.isNaN(saved)) input.value = saved;
    }
    const set = (v) => {
      apply[k](v);
      out.textContent = fmt[k](v);
      if (!embedded) try { localStorage.setItem('cube.' + k, v); } catch {}
    };
    input.addEventListener('input', () => set(parseFloat(input.value)));
    set(embedded && k === 'size' ? LOOK.size : parseFloat(input.value));  // ?size can go past the slider's max
  }
  document.getElementById('reset').onclick = () => {
    for (const input of document.querySelectorAll('.slider input')) {
      input.value = input.defaultValue;
      input.dispatchEvent(new Event('input'));
    }
  };
}
/* dev:end */

// Loader dots, in framebuffer px around the body's centre.
const DOT_GAP = 0.4, DOT_R = 0.1;  // world units
const bodyMid = new THREE.Vector3();
function updateLoader() {
  const u = compositeMat.uniforms, k = V('dR');
  u.uLoader.value = k > 0.01 ? 1 : 0;
  if (!u.uLoader.value) return;
  // the cube melts away by shrinking; this is how far it's gone (fades the eyes,
  // and lets the 3D pass be skipped once it's all dots)
  u.uMelt.value = THREE.MathUtils.clamp(1 - (V('scale') - 0.04) / 0.46, 0, 1);
  const bw = fillRT.width, bh = fillRT.height, ppu = unitPx * renderer.getPixelRatio();
  rig.updateMatrixWorld();
  bodyMid.copy(deformPoint(0, 0, 0)).applyMatrix4(rig.matrixWorld).project(camera);
  const cx = (bodyMid.x * 0.5 + 0.5) * bw, cy = (bodyMid.y * 0.5 + 0.5) * bh;
  const spread = V('dSpread'), R0 = DOT_R * ppu;
  // bunched up the dots are bigger, so together they fill the blob they came from
  const R = Math.max(0, R0 * (1 + 0.9 * (1 - spread)) * k);
  u.uGoo.value = R0 * 0.8;
  u.uDot.value.forEach((d, i) => {
    const hop = V('dBounce') * 0.14 * ppu * Math.max(0, Math.sin(clock * 7 - i * 0.9));
    d.set(cx + (i - 1) * DOT_GAP * ppu * spread, cy + hop, R);
  });
}

// Only the box around the cube is drawn; the rest of the canvas stays
// transparent. The fill pass covers a wider box than the composite, so the
// outline never samples stale pixels.
const corner = new THREE.Vector3(), box = { x0: 0, y0: 0, x1: 0, y1: 0 };
function cubeBox() {
  const bw = fillRT.width, bh = fillRT.height;
  const hx = 0.5 * U.uW.value * 1.3 + 0.12, top = -0.5 + U.uH.value * (ears.length ? 1.4 + EAR.h : 1.35);  // room for the ears
  rig.updateMatrixWorld();
  box.x0 = box.y0 = Infinity; box.x1 = box.y1 = -Infinity;
  for (const x of [-hx, hx]) for (const y of [-0.62, top]) for (const z of [-0.65, 0.65]) {
    corner.set(x, y, z).applyMatrix4(rig.matrixWorld).project(camera);
    const px = (corner.x * 0.5 + 0.5) * bw, py = (corner.y * 0.5 + 0.5) * bh;
    box.x0 = Math.min(box.x0, px); box.x1 = Math.max(box.x1, px);
    box.y0 = Math.min(box.y0, py); box.y1 = Math.max(box.y1, py);
  }
  if (compositeMat.uniforms.uLoader.value) {
    const pad = compositeMat.uniforms.uGoo.value * 2 + 16;
    for (const d of compositeMat.uniforms.uDot.value) {
      box.x0 = Math.min(box.x0, d.x - d.z - pad); box.x1 = Math.max(box.x1, d.x + d.z + pad);
      box.y0 = Math.min(box.y0, d.y - d.z - pad); box.y1 = Math.max(box.y1, d.y + d.z + pad);
    }
  }
}
function scissor(target, m) {
  const bw = fillRT.width, bh = fillRT.height;
  const x0 = Math.max(0, Math.floor(box.x0 - m)), y0 = Math.max(0, Math.floor(box.y0 - m));
  const x1 = Math.min(bw, Math.ceil(box.x1 + m)), y1 = Math.min(bh, Math.ceil(box.y1 + m));
  if (target) target.scissor.set(x0, y0, Math.max(0, x1 - x0), Math.max(0, y1 - y0));
  else { const r = renderer.getPixelRatio(); renderer.setScissor(x0 / r, y0 / r, Math.max(0, x1 - x0) / r, Math.max(0, y1 - y0) / r); }
}
fillRT.scissorTest = true;
renderer.setScissorTest(true);
function render() {
  updateLoader();
  cubeBox();
  const r = compositeMat.uniforms.uPx.value * compositeMat.uniforms.uLineScale.value * 1.35;  // same as the composite's r
  scissor(fillRT, 2 * r + 8);
  // while it's only dots, the cube isn't drawn at all
  if (compositeMat.uniforms.uMelt.value < 0.995 || !compositeMat.uniforms.uLoader.value) {
    renderer.setRenderTarget(fillRT); renderer.clear(); renderer.render(scene, camera);
  }
  renderer.setRenderTarget(null);
  // the whole canvas is cleared once, then only the box is redrawn
  renderer.setScissor(0, 0, innerWidth, innerHeight); renderer.clear();
  scissor(null, r + 4);
  renderer.render(quadScene, quadCam);
}

// 30fps always (the springs keep motion smooth at that rate), and nothing at
// all while hidden.
const FRAME_MS = 1000 / 30;
let last = performance.now(), rafId = 0, paused = false;
// drawn once: 'ready' tells the host, which can show the frame from then on
// (shown before, it may be painted over until Oby's first frame is on it)
let drawn = false;
function frame(now) {
  rafId = requestAnimationFrame(frame);
  if (now - last < FRAME_MS - 2) return;
  const dt = Math.min(1 / 20, (now - last) / 1000); last = now;
  clock += dt;
  update(dt);
  applyToScene();
  drawFace(clock);
  render();
  drawFX(unitPx);
  if (!drawn) { drawn = true; emit('ready'); }
}
function setPaused(p) {
  if (p === paused) return;
  paused = p;
  cancelAnimationFrame(rafId);
  if (!p) { last = performance.now(); rafId = requestAnimationFrame(frame); wander(rand(...AFTER_PAUSE)); }
}
// Runs only while the host hasn't paused it (oby.pause) and the page is visible.
let hostPaused = false;
const syncPaused = () => setPaused(hostPaused || document.hidden);
document.addEventListener('visibilitychange', syncPaused);
enterState();
rafId = requestAnimationFrame(frame);

/* dev:start */
// debug hooks for screenshots
window.__cube = { play: (n) => play(EXPRESSIONS.find((e) => e.name === n)), P, EXPRESSIONS, pointer, spin, ick, attn, rig, camera, get cur() { return cur.name; }, get clock() { return clock; },
  step(dt) { clock += dt; update(dt); applyToScene(); drawFace(clock); render(); drawFX(unitPx); } };  // step(dt): draw one frame by hand, for tests
/* dev:end */
</script>
</body>
