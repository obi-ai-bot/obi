# The end-to-end scenario (e2e/SCENARIO.md): `make e2e` with stub agents, on Linux and macOS.
# It is red until Phase 1 makes each step green; the run shows which steps are. `make e2e` builds
# obid from core/ with cargo first (once core/ exists), so this job needs no change when it lands.
# This file belongs to the lead (docs/ARCHITECTURE.md, section 6).
name: E2E

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# A newer push to the same pull request (or to dev) cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: obi

      # obi-sphere is private: checking it out needs a read-only token for it, kept as the
      # repository secret OBI_SPHERE_READ_TOKEN (contents: read on obi-ai-bot/obi-sphere only).
      - name: Check for the obi-sphere read token
        env:
          OBI_SPHERE_READ_TOKEN: ${{ secrets.OBI_SPHERE_READ_TOKEN }}
        run: |
          if [ -z "$OBI_SPHERE_READ_TOKEN" ]; then
            echo "::error::The secret OBI_SPHERE_READ_TOKEN is not set. The e2e scenario needs obi-ai-bot/obi-sphere, which is private: add a fine-grained token with Contents: read on that repository only, as this repository's Actions secret OBI_SPHERE_READ_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          repository: obi-ai-bot/obi-sphere
          ref: dev
          path: obi-sphere
          token: ${{ secrets.OBI_SPHERE_READ_TOKEN }}
          # The token is for this checkout only: nothing later uses it, so git doesn't keep it.
          persist-credentials: false

      # The pnpm obi-sphere pins (spec/package.json, packageManager).
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # obi-sphere's server keeps copies of this repository's e2e fixtures; they must still match
      # obi's (this checkout). The check is obi-sphere's script and needs only Node (set up above).
      # Until the server is in obi-sphere's dev, the script isn't there: the step says so and passes.
      - name: obi-sphere's copies of the e2e fixtures match obi's
        run: |
          if [ -f obi-sphere/server/scripts/check-fixtures.mjs ]; then
            OBI_DIR=obi node obi-sphere/server/scripts/check-fixtures.mjs
          else
            echo "::notice::obi-sphere/server/scripts/check-fixtures.mjs is not in obi-sphere's dev yet: the fixture comparison is skipped."
          fi

      # obid is Rust (core/): `make e2e` runs `cargo build -p obid` in it before the harness.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      # OBI_SPHERE_DIR defaults to ../obi-sphere, which is where it was checked out.
      - name: make e2e
        run: make -C obi e2e
