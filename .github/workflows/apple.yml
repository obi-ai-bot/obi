# The Mac app with MacTests, then ObyPhone (with ObyWatch embedded) with iOSTests on a simulator. See docs/ci.md.
name: Apple apps

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# A newer push to the same pull request (or to dev) cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  # CI has no signing certificates: sign ad hoc, with no team or profile. Hardened runtime off, so the
  # ad-hoc-signed test host can load the test bundle; it matters only for notarized builds.
  SIGNING: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= ENABLE_HARDENED_RUNTIME=NO
  IPHONE: platform=iOS Simulator,name=iPhone 17,OS=latest

jobs:
  test:
    name: Mac and iPhone
    # GitHub's hosted image with Xcode 27 (public preview, macOS 27 on Apple silicon).
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Xcode
        run: |
          xcodebuild -version
          xcrun simctl list devices available iPhone

      - name: Mac app and MacTests
        run: |
          set -o pipefail
          xcodebuild -project apps/Oby.xcodeproj -scheme Oby -destination 'platform=macOS' \
            $SIGNING test | xcbeautify --renderer github-actions

      - name: ObyPhone with ObyWatch, and iOSTests
        run: |
          set -o pipefail
          xcodebuild -project apps/Oby.xcodeproj -scheme ObyPhone -destination "$IPHONE" \
            $SIGNING test | xcbeautify --renderer github-actions
