# The Rust core (core/: obid and its crates) on Linux and macOS: formatting, clippy with warnings
# as errors, and the tests, against the committed Cargo.lock; and a build with the oldest Rust the
# workspace declares (`rust-version`). The tests run the job sandbox for real (bubblewrap on Linux,
# sandbox-exec on macOS) and the e2e stub agent (Node). This file belongs to the Rust core
# (docs/ARCHITECTURE.md, section 6).
name: Core

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# A newer push to the same pull request (or to dev) cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The stub agent (e2e/stub-agent) and the tests' stand-ins for Claude Code, Codex and Cursor
      # (core/crates/obid/tests/agents) are Node scripts, and the tests build the e2e fixture with
      # e2e/lib/fixture.mjs.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # The job sandbox on Linux. Ubuntu's AppArmor profile for bwrap (bwrap-userns-restrict)
      # gives it the user namespaces unprivileged processes otherwise don't get.
      - name: bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap slirp4netns
          bwrap --version
          bwrap --unshare-pid --ro-bind / / --dev /dev --proc /proc -- true

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo --version
          cargo clippy --version

      # The registry and the dependencies' build products. obid itself rebuilds from source.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test --locked
        run: cargo test --workspace --locked

  # The oldest Rust the workspace says it builds with (`rust-version` in core/Cargo.toml): the
  # workspace and its tests build with exactly that toolchain, against the committed Cargo.lock.
  msrv:
    name: Core rust-version (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Rust toolchain at rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          cargo +"$msrv" --version

      - name: cargo build at rust-version
        run: cargo +"$MSRV" build --workspace --all-targets --locked
