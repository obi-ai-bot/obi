# The Rust core (core/: obid and its crates) on Linux and macOS: formatting, clippy with warnings
# as errors, and the tests, against the committed Cargo.lock. This file belongs to the Rust core
# (docs/ARCHITECTURE.md, section 6).
name: Core

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# A newer push to the same pull request (or to dev) cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo --version
          cargo clippy --version

      # The registry and the dependencies' build products. obid itself rebuilds from source.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            core/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test --locked
        run: cargo test --workspace --locked
